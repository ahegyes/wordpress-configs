name: Tests

on:
  push:
    branches: [trunk]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ matrix.php-version }})
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.5', '8.6']
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-phpunit.yml
    with:
      php-version: ${{ matrix.php-version }}
      needs-wp-env: false
