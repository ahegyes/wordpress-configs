name: Scripts/Styles Lint

on:
  workflow_call:
    inputs:
      plugin-path:
        description: 'Path to the plugin (relative to repo root)'
        type: string
        required: false
        default: '.'
      node-version:
        description: 'Node.js version'
        type: string
        required: false
        default: 'lts/*'
      lint-scripts:
        description: 'Run `npm run lint:scripts` (ESLint). Set false for repos without JS sources.'
        type: boolean
        required: false
        default: true
      lint-styles:
        description: 'Run `npm run lint:styles` (Stylelint). Set false for repos without CSS sources.'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint scripts/styles
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.plugin-path }}/package-lock.json

      - name: Install npm dependencies
        working-directory: ${{ inputs.plugin-path }}
        run: npm ci

      - name: Lint scripts
        if: ${{ inputs.lint-scripts }}
        working-directory: ${{ inputs.plugin-path }}
        run: npm run lint:scripts

      - name: Lint styles
        if: ${{ inputs.lint-styles }}
        working-directory: ${{ inputs.plugin-path }}
        run: npm run lint:styles
