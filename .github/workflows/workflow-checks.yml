name: Workflow Checks

on:
  push:
    branches: [trunk]
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']
  schedule:
    # A weekly run off the hour keeps zizmor's online audits current between workflow changes.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-workflow-checks.yml
