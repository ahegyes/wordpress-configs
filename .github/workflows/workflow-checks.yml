name: Workflow Checks

on:
  push:
    branches: [trunk]
    paths: ['.github/workflows/**']
  pull_request:
    paths: ['.github/workflows/**']
  schedule:
    # Weekly Monday 06:17 UTC — off the top of the hour, where GitHub sheds scheduled runs, and
    # staggered against the other weekly crons. Keeps zizmor's online audits (e.g.
    # known-vulnerable-actions) fresh between workflow changes.
    - cron: '17 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  checks:
    permissions:
      contents: read
      security-events: write
      actions: read
    uses: ./.github/workflows/reusable-workflow-checks.yml

  # The WP_ENV_VERSION pins in reusable-phpunit.yml, reusable-playwright-e2e.yml, and
  # reusable-release.yml must stay identical — npx-inline @wordpress/env versions are invisible
  # to dependabot, so nothing bumps them together automatically. This job fails when any pin
  # drifts from the others.
  wp-env-version-sync:
    name: wp-env version pins in sync
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Assert WP_ENV_VERSION pins match
        run: |
          extract() {
            sed -n "s/^[[:space:]]*WP_ENV_VERSION:[[:space:]]*'\([^']*\)'.*/\1/p" "$1"
          }
          phpunit=$(extract .github/workflows/reusable-phpunit.yml)
          playwright=$(extract .github/workflows/reusable-playwright-e2e.yml)
          release=$(extract .github/workflows/reusable-release.yml)
          if [ -z "$phpunit" ] || [ -z "$playwright" ] || [ -z "$release" ]; then
            echo "::error::could not extract a WP_ENV_VERSION pin (phpunit='$phpunit', playwright='$playwright', release='$release') — an env line moved or changed quoting."
            exit 1
          fi
          if [ "$phpunit" != "$playwright" ] || [ "$phpunit" != "$release" ]; then
            echo "::error::WP_ENV_VERSION pins differ: reusable-phpunit.yml has '$phpunit', reusable-playwright-e2e.yml has '$playwright', reusable-release.yml has '$release' — they must stay identical."
            exit 1
          fi
          echo "WP_ENV_VERSION pins match: $phpunit"
