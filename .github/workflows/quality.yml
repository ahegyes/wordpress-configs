name: Quality

on:
  push:
    branches: [trunk]
  pull_request:
  schedule:
    # A weekly run surfaces advisories published against the locked dependencies between changes.
    - cron: '53 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint-php:
    name: Lint PHP
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-php-lint.yml
    with:
      scripts: '["lint:php:phpcs", "lint:php:phpcs:tests", "lint:php:phpstan"]'

  php-syntax:
    name: Check PHP syntax
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-php-syntax-check.yml

  php-syntax-legacy:
    name: Check PHP 7.4 syntax
    # The fixture stands in for a consumer's by-path files, which must still parse on PHP 7.4.
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-php-syntax-check.yml
    with:
      php-versions: '["7.4"]'
      paths: '["tests/Fixtures/build-fixture"]'

  phpcs-smoke:
    name: Smoke-test the PHPCS production profile
    # Self-lint reaches the shared profiles only through the root rulesets, which drop the WordPress runtime sniffs consumers get, so this job scans a plugin-shaped fixture with the production profile itself.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: '--prefer-dist --ignore-platform-req=php+'

      # Explaining the profile loads it and lists its sniffs without scanning a file, the cheapest proof that the XML parses and every rule reference still resolves.
      - name: Explain php/quality-assurance/phpcs.dist.xml
        run: vendor/bin/phpcs -e --standard=php/quality-assurance/phpcs.dist.xml

      - name: Scan the fixture with php/quality-assurance/phpcs.dist.xml
        shell: bash
        run: |
          # The production profile skips */tests/*, so a temp copy is scanned outside that path.
          cp -R tests/Fixtures/plugin-stub "$RUNNER_TEMP/plugin-stub"
          vendor/bin/phpcs -v --standard=php/quality-assurance/phpcs.dist.xml "$RUNNER_TEMP/plugin-stub" | tee phpcs-scan.log
          # The ruleset's own exclude-patterns can silently empty the file list, and an empty scan proves nothing.
          ! grep -qF '(0 files in queue)' phpcs-scan.log

  lint-scripts:
    name: Lint scripts
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-scripts-styles-lint.yml
    with:
      scripts: '["lint:scripts", "lint:config"]'

  supply-chain:
    name: Audit the supply chain
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-supply-chain-audit.yml

  supply-chain-release-tools:
    name: Audit the release tools
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-supply-chain-audit.yml
    with:
      project-path: php/release
      npm-audit: false

  supply-chain-block-json-tools:
    name: Audit the block.json tools
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-supply-chain-audit.yml
    with:
      project-path: node/block-json
      composer-audit: false

  block-json:
    name: Check block.json files
    # This repository ships no blocks, so the check runs against a fixture.
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-block-json-check.yml
    with:
      project-path: tests/Fixtures/block-json

  plugin-check-build:
    name: Build the Plugin Check fixture
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload the fixture build
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: build-fixture
          path: tests/Fixtures/build-fixture
          include-hidden-files: true
          retention-days: 1

  plugin-check:
    name: Run Plugin Check
    needs: plugin-check-build
    # The fixture fails Plugin Check unless the GitHub profile skips its Update URI and its missing readme.txt and the scan skips vendor-prefixed/.
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-plugin-check.yml
    with:
      artifact: build-fixture
      plugin-slug: build-fixture
