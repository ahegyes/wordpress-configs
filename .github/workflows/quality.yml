name: Quality

on:
  push:
    branches: [trunk]
  pull_request:

permissions:
  contents: read

jobs:
  php-qa:
    name: PHP QA
    # Eat our own dog food — this repo's quality.yml uses its own reusable-php-qa.
    uses: ./.github/workflows/reusable-php-qa.yml
    with:
      phpcs-config: './phpcs.dist.xml'
      phpstan-config: './phpstan.dist.neon'

  composer-require-checker:
    name: Composer Require Checker
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v4
        with:
          composer-options: '--prefer-dist'
      - run: composer lint:php:composer-require-checker

  lint-scripts:
    name: Lint scripts (ESLint)
    # Reuse the standard scripts/styles workflow with lint-styles disabled (no CSS in this repo).
    uses: ./.github/workflows/reusable-scripts-styles-lint.yml
    with:
      lint-styles: false
