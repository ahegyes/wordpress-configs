name: Quality

on:
  push:
    branches: [trunk]
  pull_request:
  schedule:
    # A weekly run surfaces advisories published against the locked dependencies between changes.
    - cron: '53 6 * * 1'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  lint-php:
    name: PHP Lint
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-php-lint.yml
    with:
      scripts: '["lint:php:phpcs", "lint:php:phpcs:tests", "lint:php:phpstan"]'

  php-syntax:
    name: PHP Syntax
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-php-syntax-check.yml

  php-syntax-legacy:
    name: PHP 7.4 syntax
    # The fixture stands in for a consumer's by-path files, which must still parse on PHP 7.4.
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-php-syntax-check.yml
    with:
      php-versions: '["7.4"]'
      paths: '["tests/fixtures/dws-build-fixture"]'

  phpcs-smoke:
    name: PHPCS dist-file smoke
    # Self-lint runs the shared profiles only through the root rulesets, which strip the WP-runtime
    # sniffs consumers get — this job scans a plugin-shaped fixture with the raw production profile.
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: '--prefer-dist --ignore-platform-req=php+'

      # phpcs -e loads the ruleset and lists its sniffs without scanning any file — the cheapest
      # possible proof that the XML parses and every <rule ref> still resolves.
      - name: Explain php/quality-assurance/phpcs.dist.xml
        run: vendor/bin/phpcs -e --standard=php/quality-assurance/phpcs.dist.xml

      - name: Scan fixture with php/quality-assurance/phpcs.dist.xml
        shell: bash
        run: |
          set -e -o pipefail
          # The production profile skips */tests/*, so a temp copy is scanned outside that path.
          cp -R tests/fixtures/plugin-stub "$RUNNER_TEMP/plugin-stub"
          vendor/bin/phpcs -v --standard=php/quality-assurance/phpcs.dist.xml "$RUNNER_TEMP/plugin-stub" | tee phpcs-scan.log
          # The ruleset's own exclude-patterns can silently empty the file list, and an empty scan proves nothing.
          ! grep -qF '(0 files in queue)' phpcs-scan.log

  lint-scripts:
    name: Lint scripts
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-scripts-styles-lint.yml
    with:
      scripts: '["lint:scripts", "lint:config"]'

  supply-chain:
    name: Supply-chain audit
    # npm gate audits production deps only — the dev-tooling graph (wp-scripts/playwright trees) is advisory via dependabot alerts.
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-supply-chain-audit.yml
    with:
      npm-audit-flags: '--omit=dev --audit-level=high'

  block-json:
    name: block.json schema check
    # Dogfoods reusable-block-json-check against a throwaway fixture; this tooling repo ships no real blocks.
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-block-json-check.yml
    with:
      project-path: tests/fixtures/block-json

  plugin-check-build:
    name: Plugin Check fixture build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Upload the fixture build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: dws-build-fixture
          path: tests/fixtures/dws-build-fixture
          include-hidden-files: true
          retention-days: 1

  plugin-check:
    name: Plugin Check
    needs: plugin-check-build
    # The fixture fails Plugin Check unless the GitHub profile skips its Update URI and its missing readme.txt and the scan skips vendor-prefixed/.
    permissions:
      contents: read
    uses: ./.github/workflows/reusable-plugin-check.yml
    with:
      artifact: dws-build-fixture
      plugin-slug: dws-build-fixture
