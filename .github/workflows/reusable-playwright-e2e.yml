name: Playwright E2E

on:
  workflow_call:
    inputs:
      project-path:
        description: 'Path to the project (relative to repo root)'
        type: string
        required: false
        default: '.'
      plugin-slug:
        description: 'Plugin slug — used to label the failure-report artifact'
        type: string
        required: true
      php-version:
        description: 'PHP version'
        type: string
        required: false
        default: '8.5'
      node-version:
        description: 'Node.js version'
        type: string
        required: false
        default: 'lts/*'
      composer-options:
        description: 'Composer install options. Plugins with a scoping pipeline that bakes deps into dependencies/ via post-autoload-dump need to omit --no-dev so the framework + PHP-DI install and scoping runs.'
        type: string
        required: false
        default: '--prefer-dist --no-dev'
      build-script:
        description: 'npm script to build assets before starting wp-env. Leave empty to skip (plugins without a frontend build).'
        type: string
        required: false
        default: 'build'
      wp-env-config-file:
        description: 'Path to a wp-env config file (relative to project-path). Leave empty to use the default .wp-env.json.'
        type: string
        required: false
        default: ''
      playwright-script:
        description: 'npm script that runs the Playwright suite. Override when the plugin wires test:e2e or similar.'
        type: string
        required: false
        default: 'test:e2e'

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.project-path }}/package-lock.json

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: ${{ inputs.project-path }}
          composer-options: ${{ inputs.composer-options }}

      - name: Install npm dependencies
        working-directory: ${{ inputs.project-path }}
        run: npm ci

      - name: Build assets
        if: inputs.build-script != ''
        working-directory: ${{ inputs.project-path }}
        env:
          BUILD_SCRIPT: ${{ inputs.build-script }}
        run: npm run "$BUILD_SCRIPT"

      - name: Resolve Playwright version
        id: playwright
        working-directory: ${{ inputs.project-path }}
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright.outputs.version }}

      - name: Install Playwright browsers
        working-directory: ${{ inputs.project-path }}
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        working-directory: ${{ inputs.project-path }}
        env:
          WP_ENV_CONFIG_FILE: ${{ inputs.wp-env-config-file }}
        run: |
          args=()
          if [ -n "$WP_ENV_CONFIG_FILE" ]; then
            args+=(--config "$WP_ENV_CONFIG_FILE")
          fi
          npx --yes @wordpress/env@11.9.0 "${args[@]}" start

      - name: Run Playwright tests
        working-directory: ${{ inputs.project-path }}
        env:
          PLAYWRIGHT_SCRIPT: ${{ inputs.playwright-script }}
        run: npm run "$PLAYWRIGHT_SCRIPT"

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-${{ inputs.plugin-slug }}
          path: ${{ inputs.project-path }}/playwright-report
          retention-days: 7

      - name: Stop wp-env
        if: always()
        working-directory: ${{ inputs.project-path }}
        env:
          WP_ENV_CONFIG_FILE: ${{ inputs.wp-env-config-file }}
        run: |
          args=()
          if [ -n "$WP_ENV_CONFIG_FILE" ]; then
            args+=(--config "$WP_ENV_CONFIG_FILE")
          fi
          npx --yes @wordpress/env@11.9.0 "${args[@]}" stop
