name: Playwright E2E

on:
  workflow_call:
    inputs:
      plugin-path:
        description: 'Path to the plugin (relative to repo root)'
        type: string
        required: false
        default: '.'
      plugin-slug:
        description: 'Plugin slug — used to label the failure-report artifact'
        type: string
        required: true
      php-version:
        description: 'PHP version'
        type: string
        required: false
        default: '8.5'
      node-version:
        description: 'Node.js version'
        type: string
        required: false
        default: 'lts/*'
      composer-options:
        description: 'Composer install options. Plugins with a scoping pipeline that bakes deps into dependencies/ via post-autoload-dump need to omit --no-dev so the framework + PHP-DI install and scoping runs.'
        type: string
        required: false
        default: '--prefer-dist --no-dev'
      build-script:
        description: 'npm script to build assets before starting wp-env. Leave empty to skip (plugins without a frontend build).'
        type: string
        required: false
        default: 'build'
      wp-env-config-file:
        description: 'Path to a wp-env config file (relative to plugin-path). Leave empty to use the default .wp-env.json.'
        type: string
        required: false
        default: ''
      playwright-script:
        description: 'npm script that runs the Playwright suite. Override when the plugin wires test:e2e or similar.'
        type: string
        required: false
        default: 'test:e2e'

permissions:
  contents: read

jobs:
  e2e:
    name: Playwright E2E
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.plugin-path }}/package-lock.json

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: ${{ inputs.plugin-path }}
          composer-options: ${{ inputs.composer-options }}

      - name: Install npm dependencies
        working-directory: ${{ inputs.plugin-path }}
        run: npm ci

      - name: Build assets
        if: inputs.build-script != ''
        working-directory: ${{ inputs.plugin-path }}
        run: npm run ${{ inputs.build-script }}

      - name: Install Playwright browsers
        working-directory: ${{ inputs.plugin-path }}
        run: npx playwright install --with-deps chromium

      - name: Start wp-env
        working-directory: ${{ inputs.plugin-path }}
        run: npx --yes @wordpress/env ${{ inputs.wp-env-config-file != '' && format('--config {0}', inputs.wp-env-config-file) || '' }} start

      - name: Run Playwright tests
        working-directory: ${{ inputs.plugin-path }}
        run: npm run ${{ inputs.playwright-script }}

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: playwright-report-${{ inputs.plugin-slug }}
          path: ${{ inputs.plugin-path }}/playwright-report
          retention-days: 7

      - name: Stop wp-env
        if: always()
        working-directory: ${{ inputs.plugin-path }}
        run: npx --yes @wordpress/env ${{ inputs.wp-env-config-file != '' && format('--config {0}', inputs.wp-env-config-file) || '' }} stop
