name: PHPUnit

on:
  workflow_call:
    inputs:
      project-path:
        description: 'Path to the project, relative to the repository root.'
        type: string
        required: false
        default: '.'
      php-version:
        description: 'PHP version for Composer and any suite outside wp-env, and for the site in wp-env when its config and override file pin no phpVersion.'
        type: string
        required: false
        default: '8.5'
      wp-version:
        description: 'WordPress release tag, such as "6.9.4". Empty defers to the wp-env config''s core, or wp-env''s latest stable release.'
        type: string
        required: false
        default: ''
      wp-env-core:
        description: 'Full WP_ENV_CORE value, such as a repository ref (Org/Repo#ref) or a zip URL. Overrides wp-version.'
        type: string
        required: false
        default: ''
      composer-script:
        description: 'Composer script that runs the suite, such as test or test:integration.'
        type: string
        required: false
        default: 'test'
      composer-options:
        description: 'Composer install options passed to the dependency-install step.'
        type: string
        required: false
        default: '--prefer-dist --ignore-platform-req=php+'
      wp-env-config-file:
        description: 'wp-env config file relative to project-path, one per environment, such as .wp-env.tests.json. Empty uses .wp-env.json.'
        type: string
        required: false
        default: ''
      wp-env-xdebug:
        description: 'Mode for wp-env start --xdebug=<mode>, such as ''coverage'' for in-container coverage drivers. Empty starts without Xdebug.'
        type: string
        required: false
        default: ''
      multisite:
        description: 'Start wp-env as a multisite network. wp-env reads multisite only from a config file, so this merges "multisite": true into the override file of the config in use (.wp-env.override.json, or <name>.override.json beside wp-env-config-file).'
        type: boolean
        required: false
        default: false
      needs-wp-env:
        description: 'Set false for unit-only suites that need no WordPress runtime. When true, the workflow installs npm dependencies on the Node version package.json declares and starts and stops the project''s own locked wp-env, so package.json and package-lock.json must declare @wordpress/env.'
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  phpunit:
    name: Run PHPUnit (PHP ${{ inputs.php-version }} / WP ${{ inputs.wp-env-core != '' && inputs.wp-env-core || inputs.wp-version != '' && inputs.wp-version || (inputs.needs-wp-env && 'consumer-default' || 'no-wp-env') }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # A job-level WP_ENV_CORE gives a consumer script that starts wp-env again the same WordPress.
      WP_ENV_CORE: ${{ inputs.wp-env-core != '' && inputs.wp-env-core || (inputs.wp-version != '' && format('WordPress/WordPress#tags/{0}', inputs.wp-version)) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2

      # Without a declared version, setup-node only warns and runs the runner's own Node.
      - name: Require a Node version in package.json
        if: ${{ inputs.needs-wp-env }}
        working-directory: ${{ inputs.project-path }}
        run: |
          if ! jq -e '[.volta.node, .volta.extends, ([.devEngines.runtime] | flatten[] | objects | select((.name | strings | ascii_downcase) == "node") | .version), .engines.node] | any' package.json > /dev/null; then
            echo "::error::package.json declares no Node version — add engines.node, volta.node or a devEngines.runtime entry named node."
            exit 1
          fi

      - name: Set up Node.js
        if: ${{ inputs.needs-wp-env }}
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: ${{ inputs.project-path }}/package.json
          cache: 'npm'
          cache-dependency-path: ${{ inputs.project-path }}/package-lock.json

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: ${{ inputs.project-path }}
          composer-options: ${{ inputs.composer-options }}

      - name: Install npm dependencies
        if: ${{ inputs.needs-wp-env }}
        working-directory: ${{ inputs.project-path }}
        run: |
          npm ci
          if [ ! -x ./node_modules/.bin/wp-env ]; then
            echo "::error::@wordpress/env is not installed in this project — add it to devDependencies. This workflow runs the version the project's lockfile pins."
            exit 1
          fi

      # Since wp-env applies WP_ENV_PHP_VERSION over a config's phpVersion, a pinned site keeps its PHP while Composer and the suite run on php-version.
      - name: Resolve the site's PHP
        if: ${{ inputs.needs-wp-env }}
        working-directory: ${{ inputs.project-path }}
        env:
          PHP_VERSION: ${{ inputs.php-version }}
          WP_ENV_CONFIG_FILE: ${{ inputs.wp-env-config-file }}
        run: |
          config="${WP_ENV_CONFIG_FILE:-.wp-env.json}"
          for file in "$config" "${config%.json}.override.json"; do
            if [ -f "$file" ] && jq -e '[.phpVersion, (.env // {} | .[] | .phpVersion?)] | map(select(. != null)) | length > 0' "$file" > /dev/null; then
              exit 0
            fi
          done
          echo "WP_ENV_PHP_VERSION=$PHP_VERSION" >> "$GITHUB_ENV"

      - name: Start wp-env
        if: ${{ inputs.needs-wp-env }}
        working-directory: ${{ inputs.project-path }}
        env:
          WP_ENV_CONFIG_FILE: ${{ inputs.wp-env-config-file }}
          WP_ENV_XDEBUG: ${{ inputs.wp-env-xdebug }}
          WP_ENV_MULTISITE: ${{ inputs.multisite }}
        run: |
          args=()
          if [ -n "$WP_ENV_CONFIG_FILE" ]; then
            args+=(--config "$WP_ENV_CONFIG_FILE")
          fi
          if [ -n "$WP_ENV_XDEBUG" ]; then
            args+=(--xdebug="$WP_ENV_XDEBUG")
          fi
          if [ "$WP_ENV_MULTISITE" = "true" ]; then
            config="${WP_ENV_CONFIG_FILE:-.wp-env.json}"
            override="${config%.json}.override.json"
            [ -f "$override" ] || echo '{}' > "$override"
            jq '.multisite = true' "$override" > "$override.tmp"
            mv "$override.tmp" "$override"
          fi
          ./node_modules/.bin/wp-env start "${args[@]}"

      - name: Run the tests
        working-directory: ${{ inputs.project-path }}
        env:
          COMPOSER_SCRIPT: ${{ inputs.composer-script }}
        run: composer "$COMPOSER_SCRIPT"

      - name: Stop wp-env
        if: ${{ always() && inputs.needs-wp-env }}
        working-directory: ${{ inputs.project-path }}
        env:
          WP_ENV_CONFIG_FILE: ${{ inputs.wp-env-config-file }}
        run: |
          # Teardown runs on failure too, including a failure that happened before the binary existed.
          [ -x ./node_modules/.bin/wp-env ] || exit 0
          args=()
          if [ -n "$WP_ENV_CONFIG_FILE" ]; then
            args+=(--config "$WP_ENV_CONFIG_FILE")
          fi
          ./node_modules/.bin/wp-env stop "${args[@]}"
