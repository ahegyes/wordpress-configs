name: PHPUnit

on:
  workflow_call:
    inputs:
      plugin-path:
        description: 'Path to the plugin (relative to repo root)'
        type: string
        required: false
        default: '.'
      php-version:
        description: 'PHP version to run tests against'
        type: string
        required: false
        default: '8.5'
      wp-version:
        description: 'WordPress version tag (e.g., "6.9.4"). Leave empty to defer to the consumer plugin''s .wp-env.json `core` setting (or wp-env''s default latest stable).'
        type: string
        required: false
        default: ''
      wp-env-core:
        description: 'Full WP_ENV_CORE value. Overrides wp-version when set. Accepts repo refs (Org/Repo#ref) or zip URLs.'
        type: string
        required: false
        default: ''
      composer-script:
        description: 'Composer script to invoke for the test run (e.g., test, test:integration).'
        type: string
        required: false
        default: 'test'
      node-version:
        description: 'Node.js version for wp-env CLI'
        type: string
        required: false
        default: 'lts/*'
      wp-env-config-file:
        description: 'Path to a wp-env config file (relative to plugin-path). Leave empty to use the default .wp-env.json. Use a separate file per environment (e.g., .wp-env.tests.json) to migrate off the deprecated implicit dev/tests split.'
        type: string
        required: false
        default: ''

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ inputs.php-version }} / WP ${{ inputs.wp-env-core != '' && inputs.wp-env-core || inputs.wp-version != '' && inputs.wp-version || 'consumer-default' }})
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2

      - name: Setup Node.js (for wp-env)
        uses: actions/setup-node@v6
        with:
          node-version: ${{ inputs.node-version }}

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          working-directory: ${{ inputs.plugin-path }}
          composer-options: '--prefer-dist'

      - name: Install npm dependencies
        working-directory: ${{ inputs.plugin-path }}
        run: npm ci

      - name: Start wp-env
        working-directory: ${{ inputs.plugin-path }}
        env:
          # Override priority: wp-env-core (full value) > wp-version (formatted as tag).
          # If both empty, WP_ENV_CORE is empty and wp-env falls back to the consumer's
          # config file `core` setting.
          WP_ENV_CORE: ${{ inputs.wp-env-core != '' && inputs.wp-env-core || (inputs.wp-version != '' && format('WordPress/WordPress#tags/{0}', inputs.wp-version)) || '' }}
        run: npx --yes @wordpress/env ${{ inputs.wp-env-config-file != '' && format('--config {0}', inputs.wp-env-config-file) || '' }} start

      - name: Run tests
        working-directory: ${{ inputs.plugin-path }}
        run: composer ${{ inputs.composer-script }}

      - name: Stop wp-env
        if: always()
        working-directory: ${{ inputs.plugin-path }}
        run: npx --yes @wordpress/env ${{ inputs.wp-env-config-file != '' && format('--config {0}', inputs.wp-env-config-file) || '' }} stop
