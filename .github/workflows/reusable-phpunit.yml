name: PHPUnit

on:
  workflow_call:
    inputs:
      project-path:
        description: 'Path to the project (relative to repo root)'
        type: string
        required: false
        default: '.'
      php-version:
        description: 'PHP version on the runner, which runs Composer and any suite that does not use wp-env. Suites inside wp-env run on the phpVersion of its config file.'
        type: string
        required: false
        default: '8.5'
      wp-version:
        description: 'WordPress version tag (e.g., "6.9.4"). Leave empty to defer to the consumer plugin''s .wp-env.json `core` setting (or wp-env''s default latest stable).'
        type: string
        required: false
        default: ''
      wp-env-core:
        description: 'Full WP_ENV_CORE value. Overrides wp-version when set. Accepts repo refs (Org/Repo#ref) or zip URLs.'
        type: string
        required: false
        default: ''
      composer-script:
        description: 'Composer script to invoke for the test run (e.g., test, test:integration).'
        type: string
        required: false
        default: 'test'
      composer-options:
        description: 'Composer install options passed to the dependency-install step.'
        type: string
        required: false
        default: '--prefer-dist --ignore-platform-req=php+'
      node-version:
        description: 'Node.js version for wp-env CLI'
        type: string
        required: false
        default: '26'
      wp-env-config-file:
        description: 'Path to a wp-env config file (relative to project-path). Leave empty to use the default .wp-env.json. Use a separate file per environment (e.g., .wp-env.tests.json) to migrate off the deprecated implicit dev/tests split.'
        type: string
        required: false
        default: ''
      wp-env-xdebug:
        description: 'Value for wp-env start --xdebug=<mode>; e.g. ''coverage'' for in-container coverage drivers. Leave empty to start without Xdebug.'
        type: string
        required: false
        default: ''
      multisite:
        description: 'Start wp-env as a multisite network. wp-env reads multisite only from a config file, so this merges "multisite": true into the override file of the config in use (.wp-env.override.json, or <name>.override.json beside wp-env-config-file).'
        type: boolean
        required: false
        default: false
      needs-wp-env:
        description: 'Set false for unit-only suites that need no WordPress runtime. When true, the workflow installs npm dependencies and starts and stops the project''s own locked wp-env, so package.json and package-lock.json must declare @wordpress/env.'
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  phpunit:
    name: PHPUnit (PHP ${{ inputs.php-version }} / WP ${{ inputs.wp-env-core != '' && inputs.wp-env-core || inputs.wp-version != '' && inputs.wp-version || (inputs.needs-wp-env && 'consumer-default' || 'no-wp-env') }})
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      # Job-level, so a consumer script that starts wp-env again gets the same WordPress; both inputs empty defers to the config's core.
      WP_ENV_CORE: ${{ inputs.wp-env-core != '' && inputs.wp-env-core || (inputs.wp-version != '' && format('WordPress/WordPress#tags/{0}', inputs.wp-version)) || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2

      - name: Setup Node.js (for wp-env)
        if: ${{ inputs.needs-wp-env }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.project-path }}/package-lock.json

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: ${{ inputs.project-path }}
          composer-options: ${{ inputs.composer-options }}

      - name: Install npm dependencies
        if: ${{ inputs.needs-wp-env }}
        working-directory: ${{ inputs.project-path }}
        run: |
          npm ci
          if [ ! -x ./node_modules/.bin/wp-env ]; then
            echo "::error::@wordpress/env is not installed in this project — add it to devDependencies. This workflow runs the version the project's lockfile pins."
            exit 1
          fi

      - name: Start wp-env
        if: ${{ inputs.needs-wp-env }}
        working-directory: ${{ inputs.project-path }}
        env:
          WP_ENV_CONFIG_FILE: ${{ inputs.wp-env-config-file }}
          WP_ENV_XDEBUG: ${{ inputs.wp-env-xdebug }}
          WP_ENV_MULTISITE: ${{ inputs.multisite }}
        run: |
          args=()
          if [ -n "$WP_ENV_CONFIG_FILE" ]; then
            args+=(--config "$WP_ENV_CONFIG_FILE")
          fi
          if [ -n "$WP_ENV_XDEBUG" ]; then
            args+=(--xdebug="$WP_ENV_XDEBUG")
          fi
          if [ "$WP_ENV_MULTISITE" = "true" ]; then
            config="${WP_ENV_CONFIG_FILE:-.wp-env.json}"
            override="${config%.json}.override.json"
            [ -f "$override" ] || echo '{}' > "$override"
            jq '.multisite = true' "$override" > "$override.tmp"
            mv "$override.tmp" "$override"
          fi
          ./node_modules/.bin/wp-env start "${args[@]}"

      - name: Run tests
        working-directory: ${{ inputs.project-path }}
        env:
          COMPOSER_SCRIPT: ${{ inputs.composer-script }}
        run: composer "$COMPOSER_SCRIPT"

      - name: Stop wp-env
        if: ${{ always() && inputs.needs-wp-env }}
        working-directory: ${{ inputs.project-path }}
        env:
          WP_ENV_CONFIG_FILE: ${{ inputs.wp-env-config-file }}
        run: |
          # Teardown runs on failure too, including a failure that happened before the binary existed.
          [ -x ./node_modules/.bin/wp-env ] || exit 0
          args=()
          if [ -n "$WP_ENV_CONFIG_FILE" ]; then
            args+=(--config "$WP_ENV_CONFIG_FILE")
          fi
          ./node_modules/.bin/wp-env stop "${args[@]}"
