name: Mutation Tests

on:
  workflow_dispatch:
  schedule:
    # Weekly on Mondays at 06:00 UTC. Catches test-suite quality regression
    # without gating every PR (mutation runs are slow).
    - cron: '0 6 * * 1'

permissions:
  contents: read

jobs:
  infection:
    name: Run Infection
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Setup PHP
        uses: shivammathur/setup-php@7c071dfe9dc99bdf297fa79cb49ea005b9fcadbc # v2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v4

      - name: Run Infection
        run: composer test:mutation

      - name: Upload Infection logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: infection-logs
          path: build/infection/
