name: Mutation Tests

on:
  workflow_dispatch:
  schedule:
    # Weekly Monday 06:41 UTC — off the top of the hour, where GitHub sheds scheduled runs, and
    # staggered against the other weekly crons. Catches test-suite quality regression
    # without gating every PR (mutation runs are slow).
    - cron: '41 6 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  infection:
    name: Run Infection
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: pcov
          tools: composer:v2

      - name: Install Composer dependencies
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          composer-options: '--prefer-dist --ignore-platform-req=php+'

      - name: Run Infection
        run: composer test:unit:mutation

      - name: Upload Infection logs
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infection-logs
          path: build/infection/
