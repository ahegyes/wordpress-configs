name: PHP Quality Assurance

on:
  workflow_call:
    inputs:
      plugin-path:
        description: 'Path to the plugin (relative to repo root)'
        type: string
        required: false
        default: '.'
      php-version:
        description: 'PHP version to run QA against'
        type: string
        required: false
        default: '8.5'
      phpcs-config:
        description: 'Path to PHPCS ruleset file (relative to plugin-path)'
        type: string
        required: false
        default: './phpcs.dist.xml'
      phpstan-config:
        description: 'Path to PHPStan config file (relative to plugin-path)'
        type: string
        required: false
        default: './phpstan.dist.neon'

jobs:
  phpcs:
    name: PHPCS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v4
        with:
          working-directory: ${{ inputs.plugin-path }}
          composer-options: '--prefer-dist'
      - name: Run PHPCS
        working-directory: ${{ inputs.plugin-path }}
        run: vendor/bin/phpcs --standard=${{ inputs.phpcs-config }} --basepath=. ./ -v --report=full

  phpstan:
    name: PHPStan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@v4
        with:
          working-directory: ${{ inputs.plugin-path }}
          composer-options: '--prefer-dist'
      - name: Run PHPStan
        working-directory: ${{ inputs.plugin-path }}
        run: vendor/bin/phpstan analyse -c ${{ inputs.phpstan-config }} -v --memory-limit=1G --no-progress
