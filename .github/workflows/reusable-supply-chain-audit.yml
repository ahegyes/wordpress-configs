name: Supply-Chain Audit

on:
  workflow_call:
    inputs:
      plugin-path:
        description: 'Path to the plugin (relative to repo root)'
        type: string
        required: false
        default: '.'
      php-version:
        description: 'PHP version for composer audit'
        type: string
        required: false
        default: '8.5'
      node-version:
        description: 'Node.js version for npm audit'
        type: string
        required: false
        default: 'lts/*'
      composer-audit:
        description: 'Run `composer audit`. Set false for repos without composer.json.'
        type: boolean
        required: false
        default: true
      npm-audit:
        description: 'Run `npm audit --omit=dev`. Set false for repos without package.json. Production-only by default — dev deps are noisy and rarely shipped.'
        type: boolean
        required: false
        default: true
      composer-audit-flags:
        description: 'Extra flags passed to `composer audit`. Defaults to --no-dev to mirror the production install matrix.'
        type: string
        required: false
        default: '--no-dev'
      npm-audit-flags:
        description: 'Extra flags passed to `npm audit`. Defaults to --omit=dev for the same reason.'
        type: string
        required: false
        default: '--omit=dev'

permissions:
  contents: read

jobs:
  composer-audit:
    if: ${{ inputs.composer-audit }}
    name: composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: ${{ inputs.plugin-path }}
          composer-options: '--prefer-dist'
      - name: composer audit
        working-directory: ${{ inputs.plugin-path }}
        env:
          AUDIT_FLAGS: ${{ inputs.composer-audit-flags }}
        run: |
          # shellcheck disable=SC2086
          composer audit $AUDIT_FLAGS

  npm-audit:
    if: ${{ inputs.npm-audit }}
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.plugin-path }}/package-lock.json
      - name: npm ci
        working-directory: ${{ inputs.plugin-path }}
        run: npm ci
      - name: npm audit
        working-directory: ${{ inputs.plugin-path }}
        env:
          AUDIT_FLAGS: ${{ inputs.npm-audit-flags }}
        run: |
          # shellcheck disable=SC2086
          npm audit $AUDIT_FLAGS
