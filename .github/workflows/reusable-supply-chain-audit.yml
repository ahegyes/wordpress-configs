name: Supply-Chain Audit

on:
  workflow_call:
    inputs:
      project-path:
        description: 'Path to the project (relative to repo root)'
        type: string
        required: false
        default: '.'
      php-version:
        description: 'PHP version for composer audit'
        type: string
        required: false
        default: '8.5'
      node-version:
        description: 'Node.js version for npm audit'
        type: string
        required: false
        default: '26'
      composer-audit:
        description: 'Run `composer audit`. Set false for repos without composer.json.'
        type: boolean
        required: false
        default: true
      npm-audit:
        description: 'Run `npm audit`. Set false for repos without package.json. Audits the full dependency graph (dev/build deps included) by default.'
        type: boolean
        required: false
        default: true
      composer-audit-flags:
        description: 'Extra flags passed to `composer audit`. Defaults to --abandoned=report — audits the full graph (dev/build deps included) and fails on security advisories, but reports abandoned packages instead of failing on them. Pass --no-dev to audit production deps only.'
        type: string
        required: false
        default: '--abandoned=report'
      npm-audit-flags:
        description: 'Extra flags passed to `npm audit`. Defaults to --audit-level=high — audits the full graph (dev/build deps included) and fails only on high/critical advisories; low/moderate are surfaced without failing. Pass --omit=dev to audit production deps only.'
        type: string
        required: false
        default: '--audit-level=high'
      fail-on-findings:
        description: 'Fail the job when an audit reports findings. Set false to run the audit advisory-only — findings are surfaced in the logs without blocking.'
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  composer-audit:
    if: ${{ inputs.composer-audit }}
    name: composer audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2
      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda
        with:
          working-directory: ${{ inputs.project-path }}
          composer-options: '--prefer-dist --ignore-platform-reqs'
      - name: composer audit
        working-directory: ${{ inputs.project-path }}
        continue-on-error: ${{ !inputs.fail-on-findings }}
        env:
          AUDIT_FLAGS: ${{ inputs.composer-audit-flags }}
        run: |
          # shellcheck disable=SC2086
          composer audit $AUDIT_FLAGS

  npm-audit:
    if: ${{ inputs.npm-audit }}
    name: npm audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
        with:
          persist-credentials: false
      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ inputs.node-version }}
          cache: 'npm'
          cache-dependency-path: ${{ inputs.project-path }}/package-lock.json
      - name: npm ci
        working-directory: ${{ inputs.project-path }}
        run: npm ci
      - name: npm audit
        working-directory: ${{ inputs.project-path }}
        continue-on-error: ${{ !inputs.fail-on-findings }}
        env:
          AUDIT_FLAGS: ${{ inputs.npm-audit-flags }}
        run: |
          # shellcheck disable=SC2086
          npm audit $AUDIT_FLAGS
