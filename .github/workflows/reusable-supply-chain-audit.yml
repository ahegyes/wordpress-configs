name: Supply-Chain Audit

on:
  workflow_call:
    inputs:
      project-path:
        description: 'Path to the project, relative to the repository root. Its composer.lock and package-lock.json are audited as committed; nothing is installed.'
        type: string
        required: false
        default: '.'
      composer-audit:
        description: 'Whether to run composer audit against composer.lock, so the lockfile is required. Set false for a project without composer.json. At least one of composer-audit and npm-audit stays enabled.'
        type: boolean
        required: false
        default: true
      npm-audit:
        description: 'Whether to run npm audit against package-lock.json, so the lockfile is required. Set false for a project without package.json. At least one of composer-audit and npm-audit stays enabled.'
        type: boolean
        required: false
        default: true
      composer-audit-flags:
        description: 'Extra composer audit flags. The default, --abandoned=report, audits the full graph, development and build dependencies included, and fails on security advisories but only reports abandoned packages. Pass --no-dev to audit the production dependencies only.'
        type: string
        required: false
        default: '--abandoned=report'
      npm-audit-flags:
        description: 'Extra npm audit flags. The default audits production dependencies only and fails on high and critical advisories, surfacing low and moderate ones without failing; drop --omit=dev to audit development dependencies too.'
        type: string
        required: false
        default: '--omit=dev --audit-level=high'
      fail-on-findings:
        description: 'Whether findings fail the job. Set false to run the audit advisory-only, surfacing findings in the logs without blocking, except a Composer filter-list match such as the malware list, which always fails.'
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      # Both audits off leaves no job to run, so the workflow succeeds having audited nothing.
      - name: Require at least one enabled audit
        if: ${{ !inputs.composer-audit && !inputs.npm-audit }}
        run: |
          echo "::error::Enable composer-audit and/or npm-audit — with both false this audit reports success without auditing anything."
          exit 1

  # Both audits read the committed lockfiles, because installing first runs third-party code (Composer plugins, npm lifecycle scripts) before the audit.
  composer-audit:
    if: ${{ inputs.composer-audit }}
    name: Audit Composer dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up PHP
        uses: shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962 # 2.40.0
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: Run composer audit
        working-directory: ${{ inputs.project-path }}
        env:
          AUDIT_FLAGS: ${{ inputs.composer-audit-flags }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        run: |
          audit_json="$(mktemp)"
          status=0
          # Composer has no distinct findings exit code, so the JSON report decides, and advisory mode softens advisories and abandoned packages but never a filter-list match.
          # shellcheck disable=SC2086
          composer audit --locked $AUDIT_FLAGS --format=json > "$audit_json" || status=$?
          cat "$audit_json"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          findings=$(AUDIT_JSON="$audit_json" php <<'PHP'
          <?php
          $data = json_decode( (string) file_get_contents( getenv( 'AUDIT_JSON' ) ), true );
          if ( ! is_array( $data ) || ! array_key_exists( 'advisories', $data ) ) {
              exit( 1 );
          }

          $filtered = array();
          foreach ( (array) ( $data['filter'] ?? array() ) as $package => $entries ) {
              $filtered[] = $package . ' (' . implode( ', ', array_unique( array_column( (array) $entries, 'listName' ) ) ) . ')';
          }

          if ( array() !== $filtered ) {
              echo 'filter:', implode( ', ', $filtered );
          } elseif ( count( (array) $data['advisories'] ) + count( (array) ( $data['abandoned'] ?? array() ) ) + count( (array) ( $data['cooldown'] ?? array() ) ) > 0 ) {
              echo 'findings';
          }
          PHP
          ) || findings="invalid"

          case "$findings" in
            filter:*)
              echo "::error::composer audit found packages on a filter list, such as the malware list: ${findings#filter:}. A filter-list match fails the audit even with fail-on-findings off."
              exit "$status"
              ;;
            findings)
              if [ "$FAIL_ON_FINDINGS" = "true" ]; then
                exit "$status"
              fi
              echo "::warning::composer audit reported findings; fail-on-findings=false leaves this advisory-only."
              ;;
            *)
              echo "::error::composer audit failed before producing a valid findings report."
              exit "$status"
              ;;
          esac

  npm-audit:
    if: ${{ inputs.npm-audit }}
    name: Audit npm dependencies
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - name: Run npm audit
        working-directory: ${{ inputs.project-path }}
        env:
          AUDIT_FLAGS: ${{ inputs.npm-audit-flags }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        run: |
          audit_json="$(mktemp)"
          status=0
          # shellcheck disable=SC2086
          npm audit --package-lock-only $AUDIT_FLAGS --json > "$audit_json" || status=$?
          cat "$audit_json"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if [ "$FAIL_ON_FINDINGS" = "true" ]; then
            exit "$status"
          fi

          # Only a report that counts vulnerabilities is softened, while an error or an unreadable report fails.
          jq -e '(.error | not) and ([.metadata.vulnerabilities // {} | .[] | numbers] | add // 0) > 0' "$audit_json" > /dev/null 2>&1 || { echo "::error::npm audit failed before producing a valid findings report."; exit "$status"; }

          echo "::warning::npm audit reported findings; fail-on-findings=false leaves this advisory-only."
