name: Supply-Chain Audit

on:
  workflow_call:
    inputs:
      project-path:
        description: 'Path to the project (relative to repo root). Its composer.lock and package-lock.json are audited as committed; nothing is installed.'
        type: string
        required: false
        default: '.'
      composer-audit:
        description: 'Run `composer audit` against composer.lock, so the lockfile is required. Set false for repos without composer.json. At least one of composer-audit / npm-audit must stay enabled.'
        type: boolean
        required: false
        default: true
      npm-audit:
        description: 'Run `npm audit` against package-lock.json, so the lockfile is required. Set false for repos without package.json. Audits the full dependency graph (dev/build deps included) by default. At least one of composer-audit / npm-audit must stay enabled.'
        type: boolean
        required: false
        default: true
      composer-audit-flags:
        description: 'Extra flags passed to `composer audit`. Defaults to --abandoned=report — audits the full graph (dev/build deps included) and fails on security advisories, but reports abandoned packages instead of failing on them. Pass --no-dev to audit production deps only.'
        type: string
        required: false
        default: '--abandoned=report'
      npm-audit-flags:
        description: 'Extra flags passed to `npm audit`. Defaults to --audit-level=high — audits the full graph (dev/build deps included) and fails only on high/critical advisories; low/moderate are surfaced without failing. Pass --omit=dev to audit production deps only.'
        type: string
        required: false
        default: '--audit-level=high'
      fail-on-findings:
        description: 'Fail the job when an audit reports findings. Set false to run the audit advisory-only — findings are surfaced in the logs without blocking, except a Composer filter-list match such as the malware list, which always fails.'
        type: boolean
        required: false
        default: true

permissions: {}

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      # Both audits off leaves no job to run, so the workflow succeeds having audited nothing.
      - name: Require at least one audit enabled
        if: ${{ !inputs.composer-audit && !inputs.npm-audit }}
        run: |
          echo "::error::Enable composer-audit and/or npm-audit — with both false this audit reports success without auditing anything."
          exit 1

  # Both audits read the committed lockfiles, because installing first runs third-party code (Composer plugins, npm lifecycle scripts) before the audit.
  composer-audit:
    if: ${{ inputs.composer-audit }}
    name: composer audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:v2
      - name: composer audit
        working-directory: ${{ inputs.project-path }}
        env:
          AUDIT_FLAGS: ${{ inputs.composer-audit-flags }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        run: |
          audit_json="$(mktemp)"
          set +e
          # Composer has no distinct findings exit code, so the JSON report decides; advisory mode softens advisories and abandoned packages, never a filter-list match.
          # shellcheck disable=SC2086
          composer audit --locked $AUDIT_FLAGS --format=json > "$audit_json"
          status=$?
          set -e
          cat "$audit_json"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          # shellcheck disable=SC2016
          findings=$(AUDIT_JSON="$audit_json" php -r '
          $data = json_decode((string) file_get_contents(getenv("AUDIT_JSON")), true);
          if (!is_array($data) || !array_key_exists("advisories", $data)) {
              exit(1);
          }
          $filtered = [];
          foreach ((array) ($data["filter"] ?? []) as $package => $entries) {
              $filtered[] = $package . " (" . implode(", ", array_unique(array_column((array) $entries, "listName"))) . ")";
          }
          if ($filtered !== []) {
              echo "filter:", implode(", ", $filtered);
          } elseif (count((array) $data["advisories"]) + count((array) ($data["abandoned"] ?? [])) > 0) {
              echo "findings";
          }
          ') || findings="invalid"

          case "$findings" in
            filter:*)
              echo "::error::composer audit found packages on a filter list, such as the malware list: ${findings#filter:}. A filter-list match fails the audit even with fail-on-findings off."
              exit "$status"
              ;;
            findings)
              if [ "$FAIL_ON_FINDINGS" = "true" ]; then
                exit "$status"
              fi
              echo "::warning::composer audit reported findings; fail-on-findings=false leaves this advisory-only."
              ;;
            *)
              echo "::error::composer audit failed before producing a valid findings report."
              exit "$status"
              ;;
          esac

  npm-audit:
    if: ${{ inputs.npm-audit }}
    name: npm audit
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '26'
      - name: npm audit
        working-directory: ${{ inputs.project-path }}
        env:
          AUDIT_FLAGS: ${{ inputs.npm-audit-flags }}
          FAIL_ON_FINDINGS: ${{ inputs.fail-on-findings }}
        run: |
          audit_json="$(mktemp)"
          set +e
          # shellcheck disable=SC2086
          npm audit --package-lock-only $AUDIT_FLAGS --json > "$audit_json"
          status=$?
          set -e
          cat "$audit_json"

          if [ "$status" -eq 0 ]; then
            exit 0
          fi

          if [ "$FAIL_ON_FINDINGS" = "true" ]; then
            exit "$status"
          fi

          AUDIT_JSON="$audit_json" node <<'NODE' || {
          const fs = require('fs');

          let data;
          try {
            data = JSON.parse(fs.readFileSync(process.env.AUDIT_JSON, 'utf8'));
          } catch {
            process.exit(1);
          }

          if (data.error || !data.metadata || !data.metadata.vulnerabilities) {
            process.exit(1);
          }

          const total = Object.values(data.metadata.vulnerabilities).reduce((sum, value) => sum + (Number(value) || 0), 0);
          process.exit(total > 0 ? 0 : 1);
          NODE
            echo "::error::npm audit failed before producing a valid findings report."
            exit "$status"
          }

          echo "::warning::npm audit reported findings; fail-on-findings=false leaves this advisory-only."
