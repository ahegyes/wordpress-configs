name: PHP Syntax Check

on:
  workflow_call:
    inputs:
      project-path:
        description: 'Path to the project (relative to repo root)'
        type: string
        required: false
        default: '.'
      php-versions:
        description: 'Non-empty JSON array of PHP versions to check (e.g. [\"8.5\",\"8.6\"])'
        type: string
        required: false
        default: '["8.5"]'
      paths:
        description: 'Non-empty JSON array of files and directories to check, relative to project-path. Directories are searched for *.php files; the default checks the whole project except vendor/ and node_modules/.'
        type: string
        required: false
        default: '["."]'

permissions: {}

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      # An empty JSON array expands to zero matrix jobs and reports success — a silent skip of the syntax check.
      - name: Reject an empty php-versions array
        env:
          PHP_VERSIONS: ${{ inputs.php-versions }}
        run: |
          if ! jq -e 'type == "array" and length > 0' <<< "$PHP_VERSIONS" > /dev/null; then
            echo "::error::php-versions must be a non-empty JSON array — got '$PHP_VERSIONS'."
            exit 1
          fi

      - name: Reject an empty paths array
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' <<< "$PATHS" > /dev/null; then
            echo "::error::paths must be a non-empty JSON array of strings — got '$PATHS'."
            exit 1
          fi

  syntax:
    name: Syntax (PHP ${{ matrix.php-version }})
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        php-version: ${{ fromJSON(inputs.php-versions) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          coverage: none
          tools: none

      - name: Check PHP syntax
        working-directory: ${{ inputs.project-path }}
        env:
          PATHS: ${{ inputs.paths }}
        run: |
          mapfile -t paths < <(jq -r '.[]' <<< "$PATHS")
          find "${paths[@]}" \
            -path ./vendor -prune -o \
            -path ./node_modules -prune -o \
            -name '*.php' -print0 > "$RUNNER_TEMP/php-files"
          # A path list that holds no PHP file would otherwise pass without checking anything.
          if [ ! -s "$RUNNER_TEMP/php-files" ]; then
            echo "::error::No PHP files found under paths $PATHS."
            exit 1
          fi
          xargs -0 -n1 -P4 php -l < "$RUNNER_TEMP/php-files"
