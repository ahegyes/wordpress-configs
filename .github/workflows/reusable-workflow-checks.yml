name: Workflow Checks

on:
  workflow_call:
    inputs:
      extra-workflows:
        description: 'JSON array of glob patterns naming workflow files outside .github/workflows that actionlint lints beside it, such as ["plugins/*/.github/workflows/*.yml"]. zizmor audits every workflow in the repository already.'
        type: string
        required: false
        default: '[]'

permissions: {}

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # actionlint reads only the root's .github/workflows unless it is given files, and then reads only those.
      - name: Resolve the actionlint files
        id: files
        env:
          EXTRA_WORKFLOWS: ${{ inputs.extra-workflows }}
        run: |
          if ! files=$(jq -r 'if type == "array" and all(.[]; type == "string" and . != "" and (contains(",") | not)) then (if length > 0 then [".github/workflows/*.yml", ".github/workflows/*.yaml"] + . | join(",") else "" end) else error end' <<< "$EXTRA_WORKFLOWS" 2> /dev/null); then
            echo "::error::extra-workflows must be a JSON array of glob patterns without commas — got '$EXTRA_WORKFLOWS'."
            exit 1
          fi
          echo "files=$files" >> "$GITHUB_OUTPUT"

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0
        with:
          version: '1.7.12'
          files: ${{ steps.files.outputs.files }}

  detect-ghas:
    name: Detect GHAS availability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: read
    outputs:
      ghas-available: ${{ steps.detect.outputs.ghas-available }}
    steps:
      - name: Detect GitHub Advanced Security availability
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The code-scanning alerts endpoint answers 403 naming Advanced Security exactly where the SARIF upload would fail, so an unclear answer is retried and then read as unavailable, which only skips the upload.
          probe_body="${RUNNER_TEMP}/ghas-probe.json"
          max_attempts=3
          retry_sleep_seconds=5
          attempt=1
          while :; do
            http_code=$(curl -s --max-time 15 -o "$probe_body" -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/code-scanning/alerts?per_page=1") || http_code="curl-error"

            if [ "$http_code" = "200" ]; then
              echo "ghas-available=true" >> "$GITHUB_OUTPUT"
              break
            fi

            if [ "$http_code" = "403" ] && grep -q 'Advanced Security must be enabled' "$probe_body" 2>/dev/null; then
              echo "::notice::GitHub Advanced Security is unavailable on this repository — zizmor still runs and fails on findings; only the Security-tab upload is skipped."
              echo "ghas-available=false" >> "$GITHUB_OUTPUT"
              break
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              attempt=$((attempt + 1))
              sleep "$retry_sleep_seconds"
              continue
            fi

            echo "::warning::GHAS availability probe was ambiguous after $max_attempts attempts (last status '$http_code') — treating GHAS as unavailable; zizmor still runs and fails on findings, so only the Security-tab upload is skipped."
            echo "ghas-available=false" >> "$GITHUB_OUTPUT"
            break
          done

  zizmor:
    name: Zizmor
    needs: detect-ghas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    env:
      # Both branches below resolve this release through the action's own version table, so a
      # repo's findings never differ by which branch it takes.
      ZIZMOR_VERSION: '1.31.1'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Advanced Security mode uploads the SARIF but never fails the job, so the count gate below blocks CI on this branch.
      - name: Run zizmor
        id: zizmor
        if: needs.detect-ghas.outputs.ghas-available == 'true'
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: ${{ env.ZIZMOR_VERSION }}

      # Without Advanced Security, zizmor runs in plain mode, where its own nonzero exit on a finding fails the job.
      - name: Run zizmor without Advanced Security
        if: needs.detect-ghas.outputs.ghas-available == 'false'
        uses: zizmorcore/zizmor-action@53290badfa369cb0bf7ad16342cb62c2fa47ac7b # v0.8.0
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          advanced-security: false
          annotations: true

      - name: Fail on zizmor findings
        if: needs.detect-ghas.outputs.ghas-available == 'true'
        env:
          SARIF: ${{ steps.zizmor.outputs.output-file }}
        run: |
          # Only a SARIF whose result count is one integer is trusted, because a non-integer count would make the comparison error and the check fall through.
          if [ ! -s "$SARIF" ]; then
            echo "::error::zizmor produced no SARIF at '$SARIF' — cannot confirm a clean scan."
            exit 1
          fi
          if ! count=$(jq 'if (.runs | type) == "array" then reduce .runs[] as $r (0; . + (($r.results // []) | if type == "array" then length else error("run.results is not an array") end)) else error("not a SARIF document") end' "$SARIF"); then
            echo "::error::zizmor SARIF at '$SARIF' is missing or malformed — cannot confirm a clean scan."
            exit 1
          fi
          # Whole-string integer check (grep is line-oriented, so a multi-document count would slip
          # through it); anything but a single non-negative integer is an unknown result.
          case "$count" in
            '' | *[!0-9]*)
              echo "::error::unexpected zizmor finding count '$count' — cannot confirm a clean scan."
              exit 1
              ;;
          esac
          echo "zizmor reported $count finding(s)."
          if [ "$count" -ne 0 ]; then
            echo "::error::zizmor reported $count finding(s) — see the Security tab."
            exit 1
          fi
