name: Workflow Checks

on:
  workflow_call:

permissions: {}

jobs:
  actionlint:
    name: Actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Run actionlint
        uses: raven-actions/actionlint@3d39aea434753780c3b3d4a1a31c854b4dbf49d7 # v2.2.0

  detect-ghas:
    name: Detect GHAS availability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: read
    outputs:
      ghas-available: ${{ steps.detect.outputs.ghas-available }}
    steps:
      - name: Detect GitHub Advanced Security availability
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # code-scanning/alerts is GHAS-gated: a 200 (even an empty list) means the feature is
          # available; a 403 naming Advanced Security is the exact failure the SARIF upload below
          # would hit on a private repo without the feature, so probing this surfaces it first. A
          # confirmed-absent 403 is trusted immediately. Everything else — a curl error, a transient
          # 5xx, an unrecognized 403 body — is ambiguous and gets retried up to max_attempts times
          # before the loop gives up.
          #
          # An unresolved ambiguity resolves to "unavailable": the native-mode zizmor branch below
          # still scans and fails the job on any finding, so guessing wrong only costs the
          # Security-tab upload — a safe degradation.
          probe_body="${RUNNER_TEMP}/ghas-probe.json"
          max_attempts=3
          retry_sleep_seconds=5
          attempt=1
          while :; do
            http_code=$(curl -s --max-time 15 -o "$probe_body" -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/code-scanning/alerts?per_page=1") || http_code="curl-error"

            if [ "$http_code" = "200" ]; then
              echo "ghas-available=true" >> "$GITHUB_OUTPUT"
              break
            fi

            if [ "$http_code" = "403" ] && grep -q 'Advanced Security must be enabled' "$probe_body" 2>/dev/null; then
              echo "::notice::GitHub Advanced Security is unavailable on this repository — zizmor still runs and fails on findings; only the Security-tab upload is skipped."
              echo "ghas-available=false" >> "$GITHUB_OUTPUT"
              break
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              attempt=$((attempt + 1))
              sleep "$retry_sleep_seconds"
              continue
            fi

            echo "::warning::GHAS availability probe was ambiguous after $max_attempts attempts (last status '$http_code') — treating GHAS as unavailable; zizmor still runs and fails on findings, so only the Security-tab upload is skipped."
            echo "ghas-available=false" >> "$GITHUB_OUTPUT"
            break
          done

  zizmor:
    name: Zizmor
    needs: detect-ghas
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: write
      contents: read
      actions: read
    env:
      # Both branches below resolve this release through the action's own version table, so a
      # repo's findings never differ by which branch it takes.
      ZIZMOR_VERSION: '1.26.1'
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      # Advanced Security mode uploads the SARIF but never fails the job, so the count gate below blocks CI on this branch.
      - name: Run zizmor
        id: zizmor
        if: needs.detect-ghas.outputs.ghas-available == 'true'
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          version: ${{ env.ZIZMOR_VERSION }}

      # No-GHAS path: the same pinned action in native mode. advanced-security:false skips the
      # Security-tab upload and drops --format=sarif, so zizmor runs in plain mode and its own
      # nonzero exit on any finding fails the job directly — no count gate on this branch.
      # annotations:true surfaces findings inline on the PR.
      - name: Run zizmor without Advanced Security
        if: needs.detect-ghas.outputs.ghas-available == 'false'
        uses: zizmorcore/zizmor-action@192e21d79ab29983730a13d1382995c2307fbcaa # v0.5.7
        with:
          version: ${{ env.ZIZMOR_VERSION }}
          advanced-security: false
          annotations: true

      - name: Fail on zizmor findings
        if: needs.detect-ghas.outputs.ghas-available == 'true'
        env:
          SARIF: ${{ steps.zizmor.outputs.output-file }}
        run: |
          # Fail closed: only a well-formed SARIF whose runs[].results count is a single integer is
          # trusted. A missing/empty file, unparseable JSON, parseable-but-non-SARIF JSON ({}, null,
          # {"runs":{}}), or a multi-document count is an unknown scan result and must not pass — an
          # empty/non-integer $count would otherwise make `[ -ne 0 ]` error and the `if` fall through.
          if [ ! -s "$SARIF" ]; then
            echo "::error::zizmor produced no SARIF at '$SARIF' — cannot confirm a clean scan."
            exit 1
          fi
          if ! count=$(jq 'if (.runs | type) == "array" then reduce .runs[] as $r (0; . + (($r.results // []) | if type == "array" then length else error("run.results is not an array") end)) else error("not a SARIF document") end' "$SARIF"); then
            echo "::error::zizmor SARIF at '$SARIF' is missing or malformed — cannot confirm a clean scan."
            exit 1
          fi
          # Whole-string integer check (grep is line-oriented, so a multi-document count would slip
          # through it); anything but a single non-negative integer is an unknown result.
          case "$count" in
            '' | *[!0-9]*)
              echo "::error::unexpected zizmor finding count '$count' — cannot confirm a clean scan."
              exit 1
              ;;
          esac
          echo "zizmor reported $count finding(s)."
          if [ "$count" -ne 0 ]; then
            echo "::error::zizmor reported $count finding(s) — see the Security tab."
            exit 1
          fi
