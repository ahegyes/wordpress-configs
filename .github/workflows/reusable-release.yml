name: Release
# Callers grant `contents: write` and `actions: read`; a caller must grant every permission the called jobs declare, or the call fails at startup.

on:
  workflow_call:
    inputs:
      plugin-slug:
        description: 'Plugin slug: the directory the zip unpacks to, the name of the archive and the POT, and the required Text Domain.'
        type: string
        required: true
      project-path:
        description: 'Path to the project (relative to repo root). npm ci runs here, so package.json and package-lock.json are required, declaring a Node version and @wordpress/env, whose locked version runs the built-artifact test.'
        type: string
        required: false
        default: '.'
      entry-file:
        description: 'Main plugin file carrying the plugin headers, relative to project-path. Empty uses <plugin-slug>.php.'
        type: string
        required: false
        default: ''
      php-version:
        description: 'PHP version for the build, Plugin Check and the built-artifact test. It must meet the Requires PHP header, or WordPress refuses to activate the artifact.'
        type: string
        required: false
        default: '8.5'
      wp-env-config-file:
        description: 'wp-env config file the built-artifact test starts, relative to project-path. Empty uses .wp-env.json. It must map wp-content/plugins/<plugin-slug> to the plugin source.'
        type: string
        required: false
        default: ''
      plugin-check:
        description: 'Whether to run WordPress Plugin Check against the built plugin archive'
        type: boolean
        required: false
        default: true
      generate-pot:
        description: 'Regenerate languages/<plugin-slug>.pot via wp i18n make-pot before archive creation; set false only for plugins with no translatable strings'
        type: boolean
        required: false
        default: true
      wp-org:
        description: 'Also publish to wp.org: the build requires readme.txt and runs the full Plugin Check set, and a deploy job commits the archive to SVN from the wp-org-release environment. The default distribution is a GitHub release only.'
        type: boolean
        required: false
        default: false
      required-workflows:
        description: 'JSON array of workflow files, relative to the repository root, that must have a successful push run on the released commit.'
        type: string
        required: false
        default: '[".github/workflows/quality.yml", ".github/workflows/tests.yml"]'
      publish:
        description: 'Whether to create the GitHub release, and the wp.org deploy when wp-org is true. True requires a version tag; false builds and tests the release on any ref, and also checks provenance when the caller ran on workflow_dispatch.'
        type: boolean
        required: false
        default: true

concurrency:
  group: release-${{ inputs.plugin-slug }}
  cancel-in-progress: false

permissions: {}

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      # Plugin Check's action starts its own wp-env without a phpVersion, and WordPress refuses to activate a plugin whose Requires PHP the default image does not meet.
      WP_ENV_PHP_VERSION: ${{ inputs.php-version }}
      PLUGIN_SLUG: ${{ inputs.plugin-slug }}
      ENTRY_FILE: ${{ inputs.entry-file != '' && inputs.entry-file || format('{0}.php', inputs.plugin-slug) }}
      WP_ORG: ${{ inputs.wp-org }}
    outputs:
      digest: ${{ steps.archive-digest.outputs.digest }}
      requires-scoped: ${{ steps.scoping.outputs.requires-scoped }}
      version: ${{ steps.versions.outputs.version }}
    steps:
      - name: Enforce release inputs
        id: release-inputs
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PROJECT_PATH: ${{ inputs.project-path }}
          PUBLISH: ${{ inputs.publish }}
        run: |
          # Slash-wrap so a `..` segment anywhere (start, middle, end, or whole) is caught.
          has_dotdot_segment() {
            case "/$1/" in
              */../*) return 0 ;;
              *) return 1 ;;
            esac
          }

          validate_path_input() {
            name="$1"
            value="$2"
            if ! printf '%s' "$value" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
              echo "::error::$name must match ^[A-Za-z0-9._/-]+$ — got '$value'."
              exit 1
            fi
            case "$value" in
              /*)
                echo "::error::$name must be relative — got '$value'."
                exit 1
                ;;
            esac
            if has_dotdot_segment "$value"; then
              echo "::error::$name must not contain a .. path segment — got '$value'."
              exit 1
            fi
          }

          tag_version=''
          if [ "$REF_TYPE" = "tag" ]; then
            if ! printf '%s' "$REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$'; then
              echo "::error::Releases run from version tags only (vMAJOR.MINOR.PATCH, no leading zeros) — got '$REF_NAME'."
              exit 1
            fi
            tag_version="${REF_NAME#v}"
          elif [ "$PUBLISH" = "true" ]; then
            echo "::error::publish is on, but $REF_TYPE '$REF_NAME' is not a tag — run from a version tag, or turn publish off to run the release without publishing."
            exit 1
          fi
          if ! printf '%s' "$PLUGIN_SLUG" | grep -Eq '^[a-z0-9-]+$'; then
            echo "::error::plugin-slug must match ^[a-z0-9-]+$ — got '$PLUGIN_SLUG'."
            exit 1
          fi
          validate_path_input 'project-path' "$PROJECT_PATH"
          # WordPress reads plugin headers only from files at the plugin's root.
          if ! printf '%s' "$ENTRY_FILE" | grep -Eq '^[A-Za-z0-9._-]+\.php$'; then
            echo "::error::entry-file must be a PHP file name at the project root — got '$ENTRY_FILE'."
            exit 1
          fi

          echo "tag-version=$tag_version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Verify .distignore exists
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ ! -f .distignore ]; then
            echo "::error::Missing .distignore — refusing to build an archive without explicit file exclusions."
            exit 1
          fi

      - name: Verify version consistency
        id: versions
        working-directory: ${{ inputs.project-path }}
        env:
          TAG_VERSION: ${{ steps.release-inputs.outputs.tag-version }}
        run: |
          if [ ! -f "$ENTRY_FILE" ]; then
            echo "::error::The entry file $ENTRY_FILE does not exist — set entry-file to the main plugin file."
            exit 1
          fi
          header_version=$(sed -nE 's|^[[:space:]/*#@]*[Vv]ersion:[[:space:]]*([^[:space:]]+).*$|\1|p' "$ENTRY_FILE" | head -n 1)
          stable_tag=''
          if [ -f readme.txt ]; then
            stable_tag=$(sed -nE 's|^[[:space:]]*[Ss]table [Tt]ag:[[:space:]]*([^[:space:]]+).*$|\1|p' readme.txt | head -n 1)
          elif [ "$WP_ORG" = "true" ]; then
            echo "::error::A wp.org release needs readme.txt, whose Stable tag must equal the release version."
            exit 1
          fi
          if [ -z "$header_version" ] \
            || { [ -n "$TAG_VERSION" ] && [ "$TAG_VERSION" != "$header_version" ]; } \
            || { [ -f readme.txt ] && [ "$stable_tag" != "$header_version" ]; }; then
            echo "::error::Release versions disagree — tag: '${TAG_VERSION:-none}', $ENTRY_FILE Version header: '$header_version', readme.txt Stable tag: '${stable_tag:-none}'."
            exit 1
          fi
          echo "version=$header_version" >> "$GITHUB_OUTPUT"

      - name: Verify the text domain
        working-directory: ${{ inputs.project-path }}
        run: |
          header_domain=$(sed -nE 's|^[[:space:]/*#@]*Text Domain:[[:space:]]*([^[:space:]]+).*$|\1|p' "$ENTRY_FILE" | head -n 1)
          composer_domain=''
          if [ -f composer.json ]; then
            composer_domain=$(jq -r '.extra["text-domain"] // empty' composer.json)
          fi
          if [ "$header_domain" != "$PLUGIN_SLUG" ] || { [ -n "$composer_domain" ] && [ "$composer_domain" != "$PLUGIN_SLUG" ]; }; then
            echo "::error::The text domain must equal the plugin slug '$PLUGIN_SLUG' — $ENTRY_FILE Text Domain header: '${header_domain:-none}', composer.json extra.text-domain: '${composer_domain:-none}'."
            exit 1
          fi

      - name: Detect the scoping pipeline
        id: scoping
        working-directory: ${{ inputs.project-path }}
        run: |
          requires_scoped=$(jq -r 'if (.extra["scoping-prefix"] | type) == "string" then "true" else "false" end' composer.json)
          echo "REQUIRES_SCOPED=$requires_scoped" >> "$GITHUB_ENV"
          echo "requires-scoped=$requires_scoped" >> "$GITHUB_OUTPUT"

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2, wp-cli

      # Without a declared version, setup-node only warns and runs the runner's own Node.
      - name: Require a Node version in package.json
        working-directory: ${{ inputs.project-path }}
        run: |
          if ! jq -e '[.volta.node, .volta.extends, ([.devEngines.runtime] | flatten[] | objects | select((.name | strings | ascii_downcase) == "node") | .version), .engines.node] | any' package.json > /dev/null; then
            echo "::error::package.json declares no Node version — add engines.node, volta.node or a devEngines.runtime entry named node."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.project-path }}/package.json
          package-manager-cache: false

      # A plain install restores no dependency cache, which another workflow could have written and Composer cannot check without dist checksums.
      - name: Install Composer dependencies (dev — runs the scoping pipeline)
        working-directory: ${{ inputs.project-path }}
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=php+

      - name: Build assets
        working-directory: ${{ inputs.project-path }}
        run: |
          npm ci
          npm run build --if-present

      - name: Generate POT
        if: ${{ inputs.generate-pot }}
        working-directory: ${{ inputs.project-path }}
        run: |
          mkdir -p languages
          wp i18n make-pot . "languages/$PLUGIN_SLUG.pot" --domain="$PLUGIN_SLUG"

      - name: Verify the POT covers the scoped strings
        if: ${{ inputs.generate-pot }}
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ "$REQUIRES_SCOPED" = "true" ] \
            && [ -d vendor-prefixed ] \
            && grep -rqF --include='*.php' "'$PLUGIN_SLUG'" vendor-prefixed \
            && ! grep -Fq '#: vendor-prefixed/' "languages/$PLUGIN_SLUG.pot"; then
            echo "::error::vendor-prefixed/ carries strings in the '$PLUGIN_SLUG' text domain, but languages/$PLUGIN_SLUG.pot has none of them."
            exit 1
          fi

      # --no-scripts avoids invoking handlers that were just pruned from require-dev.
      - name: Prune to production dependencies
        working-directory: ${{ inputs.project-path }}
        run: composer install --no-dev --prefer-dist --ignore-platform-req=php+ --optimize-autoloader --no-scripts

      - name: Verify the headers cover the shipped packages
        working-directory: ${{ inputs.project-path }}
        run: |
          php <<'PHP'
          <?php
          $entry_file = (string) getenv('ENTRY_FILE');
          $source = (string) file_get_contents($entry_file);
          $header = static fn (string $name): string => preg_match('/^[ \t\/*#@]*' . preg_quote($name, '/') . ':[ \t]*(.*?)[ \t]*$/mi', $source, $match) ? $match[1] : '';
          // Three numeric segments, so version_compare() reads 8.5 and 8.5.0 alike.
          $normalize = static fn (string $version): string => implode('.', array_pad(array_slice(array_map('intval', explode('.', $version)), 0, 3), 3, 0));
          // Composer's platform-check reading: the lowest version an alternative admits, and the lowest across alternatives.
          $lower_bound = static function (string $constraint) use ($normalize): ?string {
              $lowest = null;
              foreach (preg_split('/\s*\|\|?\s*/', trim($constraint)) as $alternative) {
                  $bound = '0.0.0';
                  $alternative = (string) preg_replace(['/(?<=[<>=~^!])\s+/', '/\s+-\s+\S+/'], '', $alternative);
                  foreach (preg_split('/[\s,]+/', $alternative) as $part) {
                      if ('*' === $part || preg_match('/^(?:<|<=|!=)/', $part)) {
                          continue;
                      }
                      if (!preg_match('/^(?:>=|>|==?|\^|~)?v?(\d+(?:\.\d+)*)(?:\.[*x])?(?:-[a-z]+[.\d]*)?(?:@\w+)?$/i', $part, $match)) {
                          return null;
                      }
                      if (version_compare($normalize($match[1]), $bound, '>')) {
                          $bound = $normalize($match[1]);
                      }
                  }
                  if (null === $lowest || version_compare($bound, $lowest, '<')) {
                      $lowest = $bound;
                  }
              }
              return $lowest;
          };

          // Scoped packages ship from vendor-prefixed/ although Composer counts them as development packages.
          $packages = [];
          if (is_file('vendor/composer/installed.json')) {
              $installed = json_decode((string) file_get_contents('vendor/composer/installed.json'), true);
              foreach ($installed['packages'] ?? [] as $package) {
                  if (!in_array($package['name'], $installed['dev-package-names'] ?? [], true)) {
                      $packages[] = $package;
                  }
              }
          }
          foreach (glob('vendor-prefixed/*/*/composer.json') ?: [] as $manifest) {
              $packages[] = json_decode((string) file_get_contents($manifest), true);
          }

          $errors = [];
          $floors = ['Requires PHP' => [], 'Requires at least' => []];
          $plugins = [];
          foreach ($packages as $package) {
              $name = $package['name'] ?? '(unnamed)';
              if (is_string($package['require']['php'] ?? null)) {
                  $bound = $lower_bound($package['require']['php']);
                  if (null === $bound) {
                      $errors[] = "Cannot read the PHP constraint '{$package['require']['php']}' of $name.";
                  } else {
                      $floors['Requires PHP'][$name] = $bound;
                  }
              }
              if (is_string($package['extra']['requires-wp'] ?? null)) {
                  $floors['Requires at least'][$name] = $normalize($package['extra']['requires-wp']);
              }
              foreach ((array) ($package['extra']['requires-plugins'] ?? []) as $slug) {
                  $plugins[(string) $slug][] = $name;
              }
          }

          foreach ($floors as $header_name => $bounds) {
              $declared = $header($header_name);
              $above = array_filter($bounds, static fn (string $bound): bool => version_compare($bound, $normalize($declared), '>'));
              if ([] !== $above) {
                  $needs = implode(', ', array_map(static fn (string $package, string $bound): string => "$package ($bound)", array_keys($above), $above));
                  $errors[] = "$entry_file $header_name '$declared' is below what shipped packages require: $needs.";
              }
          }
          $declared_plugins = array_map('trim', explode(',', $header('Requires Plugins')));
          foreach (array_diff_key($plugins, array_flip($declared_plugins)) as $slug => $names) {
              $errors[] = "$entry_file Requires Plugins lacks '$slug', which " . implode(', ', $names) . ' requires.';
          }

          foreach ($errors as $error) {
              echo "::error::$error\n";
          }
          exit([] === $errors ? 0 : 1);
          PHP

      - name: Create plugin archive
        working-directory: ${{ inputs.project-path }}
        run: |
          wp package install wp-cli/dist-archive-command:3.2.2
          wp dist-archive . "./$PLUGIN_SLUG.zip" --plugin-dirname="$PLUGIN_SLUG"

      - name: Assert required files present
        working-directory: ${{ inputs.project-path }}
        run: |
          entries=$(unzip -Z1 "$PLUGIN_SLUG.zip")
          required=("$PLUGIN_SLUG/$ENTRY_FILE")
          if [ "$WP_ORG" = "true" ]; then
            required+=("$PLUGIN_SLUG/readme.txt")
          fi
          status=0
          for file in "${required[@]}"; do
            if ! grep -qxF -- "$file" <<< "$entries"; then
              echo "::error::Archive is missing $file."
              status=1
            fi
          done
          exit "$status"

      - name: Assert scoped packages bundled
        if: ${{ steps.scoping.outputs.requires-scoped == 'true' }}
        working-directory: ${{ inputs.project-path }}
        run: |
          entries=$(unzip -Z1 "$PLUGIN_SLUG.zip")
          status=0

          if ! grep -qxF -- "$PLUGIN_SLUG/vendor-prefixed/scoper-autoload.php" <<< "$entries"; then
            echo "::error::Archive is missing $PLUGIN_SLUG/vendor-prefixed/scoper-autoload.php."
            status=1
          fi

          scoped_package_roots=$(find vendor-prefixed -mindepth 3 -maxdepth 3 -type f -name composer.json -exec dirname {} \; 2>/dev/null | LC_ALL=C sort -u)
          if [ -z "$scoped_package_roots" ]; then
            echo "::error::No scoped package under vendor-prefixed/<vendor>/<package>/ — the scoping pipeline did not run."
            status=1
          fi
          while IFS= read -r pkg; do
            [ -n "$pkg" ] || continue
            if ! grep -F -- "$PLUGIN_SLUG/$pkg/" <<< "$entries" | grep -q '[^/]$'; then
              echo "::error::Archive is missing scoped package $pkg/."
              status=1
            fi
          done <<< "$scoped_package_roots"
          exit "$status"

      - name: Assert forbidden entries absent
        working-directory: ${{ inputs.project-path }}
        run: |
          entries=$(unzip -Z1 "$PLUGIN_SLUG.zip")
          status=0
          while IFS= read -r entry; do
            case "$entry" in
              "$PLUGIN_SLUG/node_modules/"*|"$PLUGIN_SLUG/"*/node_modules/*|"$PLUGIN_SLUG/tests/"*|"$PLUGIN_SLUG/"*/tests/*|"$PLUGIN_SLUG/vendor/bin/"*|"$PLUGIN_SLUG/"*/vendor/bin/*)
                echo "::error::Archive must not contain $entry."
                status=1
                ;;
              "$PLUGIN_SLUG/.git/"*|"$PLUGIN_SLUG/.github/"*|"$PLUGIN_SLUG/.idea/"*|"$PLUGIN_SLUG/.vscode/"*|"$PLUGIN_SLUG/.wordpress-org/"*)
                echo "::error::Archive must not contain $entry."
                status=1
                ;;
              "$PLUGIN_SLUG/.editorconfig"|"$PLUGIN_SLUG/.gitattributes"|"$PLUGIN_SLUG/.gitignore"|"$PLUGIN_SLUG/.distignore")
                echo "::error::Archive must not contain $entry."
                status=1
                ;;
              "$PLUGIN_SLUG/composer.json"|"$PLUGIN_SLUG/composer.lock"|"$PLUGIN_SLUG/package.json"|"$PLUGIN_SLUG/package-lock.json")
                echo "::error::Archive must not contain $entry."
                status=1
                ;;
              "$PLUGIN_SLUG/phpcs"*.xml*|"$PLUGIN_SLUG/.phpcs"*.xml*|"$PLUGIN_SLUG/.phpstan.neon"|"$PLUGIN_SLUG/phpstan.dist.neon")
                echo "::error::Archive must not contain $entry."
                status=1
                ;;
              "$PLUGIN_SLUG/phpunit.xml"|"$PLUGIN_SLUG/phpunit.xml."*|"$PLUGIN_SLUG/infection.json"|"$PLUGIN_SLUG/infection.json."*)
                echo "::error::Archive must not contain $entry."
                status=1
                ;;
              "$PLUGIN_SLUG/eslint.config."*|"$PLUGIN_SLUG/stylelint.config."*|"$PLUGIN_SLUG/tsconfig.json"|"$PLUGIN_SLUG/playwright.config."*)
                echo "::error::Archive must not contain $entry."
                status=1
                ;;
              "$PLUGIN_SLUG/scoper.inc.php"|"$PLUGIN_SLUG/.wp-env"*)
                echo "::error::Archive must not contain $entry."
                status=1
                ;;
              # Bundled CA/cert files under vendor/ or vendor-prefixed/ are legitimate
              # runtime resources, not secrets. This exempt arm MUST stay ahead of the broad
              # *.pem/*.key secret arm below — `case` stops at the first match, so reordering or
              # merging the two would start flagging bundled certs (or suppress the secret check).
              "$PLUGIN_SLUG/vendor/"*.pem|"$PLUGIN_SLUG/"*"/vendor/"*.pem|"$PLUGIN_SLUG/vendor/"*.key|"$PLUGIN_SLUG/"*"/vendor/"*.key \
                |"$PLUGIN_SLUG/vendor-prefixed/"*.pem|"$PLUGIN_SLUG/vendor-prefixed/"*.key)
                ;;
              "$PLUGIN_SLUG/.env"*|"$PLUGIN_SLUG/"*"/.env"* \
                |"$PLUGIN_SLUG/.npmrc"|"$PLUGIN_SLUG/"*"/.npmrc" \
                |"$PLUGIN_SLUG/auth.json"|"$PLUGIN_SLUG/"*"/auth.json" \
                |"$PLUGIN_SLUG/id_rsa"*|"$PLUGIN_SLUG/"*"/id_rsa"* \
                |"$PLUGIN_SLUG/"*.pem|"$PLUGIN_SLUG/"*.key)
                echo "::error::Archive must not contain secret file $entry."
                status=1
                ;;
            esac
          done <<< "$entries"
          exit "$status"

      - name: Record archive digest
        id: archive-digest
        working-directory: ${{ inputs.project-path }}
        run: |
          digest=$(sha256sum "$PLUGIN_SLUG.zip" | awk '{print $1}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Prepare Plugin Check build
        if: ${{ inputs.plugin-check }}
        working-directory: ${{ inputs.project-path }}
        run: |
          rm -rf plugin-check-build
          unzip -q "$PLUGIN_SLUG.zip" -d ./plugin-check-build

      - name: Run Plugin Check
        if: ${{ inputs.plugin-check }}
        uses: WordPress/plugin-check-action@10857da14b6c2246d15402b3e69f777edcf8c12e # v1.1.9
        with:
          build-dir: ${{ inputs.project-path }}/plugin-check-build/${{ inputs.plugin-slug }}
          slug: ${{ inputs.plugin-slug }}
          # A GitHub-distributed build carries an Update URI and no readme.txt by design; wp.org builds run the full set.
          exclude-checks: ${{ !inputs.wp-org && 'plugin_updater,plugin_readme' || '' }}
          # An empty token skips the pull request comment, which this job's token has no permission to post.
          repo-token: ''

      - name: Upload zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.plugin-slug }}-zip
          path: ${{ inputs.project-path }}/${{ inputs.plugin-slug }}.zip
          retention-days: 30

      - name: Prepare wp.org assets artifact
        if: ${{ inputs.wp-org }}
        working-directory: ${{ inputs.project-path }}
        run: |
          rm -rf wp-org-assets-artifact
          mkdir -p wp-org-assets-artifact
          if [ -d .wordpress-org ]; then
            cp -R .wordpress-org/. wp-org-assets-artifact/
          fi
          touch wp-org-assets-artifact/__artifact_keep__

      - name: Upload wp.org assets artifact
        if: ${{ inputs.wp-org }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.plugin-slug }}-wp-org-assets
          path: ${{ inputs.project-path }}/wp-org-assets-artifact/**
          retention-days: 30

  test:
    name: Test built artifact
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      PLUGIN_SLUG: ${{ inputs.plugin-slug }}
      WP_ENV_CONFIG_FILE: ${{ inputs.wp-env-config-file }}
      # wp-env lets this variable win over the config's phpVersion, so the artifact runs on the PHP the build was checked on.
      WP_ENV_PHP_VERSION: ${{ inputs.php-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download built artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plugin-slug }}-zip
          path: ./dist

      - name: Verify artifact digest
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          actual_digest=$(sha256sum "./dist/$PLUGIN_SLUG.zip" | awk '{print $1}')
          if [ "$actual_digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error::Zip digest mismatch — expected '$EXPECTED_DIGEST', got '$actual_digest'."
            exit 1
          fi

      - name: Extract artifact
        run: unzip -q "./dist/$PLUGIN_SLUG.zip" -d ./built-test

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2

      # Without a declared version, setup-node only warns and runs the runner's own Node.
      - name: Require a Node version in package.json
        working-directory: ${{ inputs.project-path }}
        run: |
          if ! jq -e '[.volta.node, .volta.extends, ([.devEngines.runtime] | flatten[] | objects | select((.name | strings | ascii_downcase) == "node") | .version), .engines.node] | any' package.json > /dev/null; then
            echo "::error::package.json declares no Node version — add engines.node, volta.node or a devEngines.runtime entry named node."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: ${{ inputs.project-path }}/package.json
          package-manager-cache: false

      - name: Install Composer dependencies (E2E harness)
        working-directory: ${{ inputs.project-path }}
        run: composer install --no-interaction --no-progress --prefer-dist --ignore-platform-req=php+

      - name: Install npm dependencies (E2E runner)
        working-directory: ${{ inputs.project-path }}
        run: |
          npm ci
          if [ ! -x ./node_modules/.bin/wp-env ]; then
            echo "::error::@wordpress/env is not installed in this project — add it to devDependencies. This workflow runs the version the project's lockfile pins."
            exit 1
          fi

      - name: Redirect wp-env at built artifact
        working-directory: ${{ inputs.project-path }}
        env:
          BUILT_PATH: ${{ github.workspace }}/built-test/${{ inputs.plugin-slug }}
        run: |
          key="wp-content/plugins/$PLUGIN_SLUG"
          config="${WP_ENV_CONFIG_FILE:-.wp-env.json}"
          if [ ! -f "$config" ] || ! jq -e --arg key "$key" '.mappings | has($key)' "$config" > /dev/null; then
            echo "::error::Release contract violation — $config must exist and map \"$key\" to the plugin source; found mappings: $(jq -c '.mappings // {}' "$config" 2> /dev/null || echo 'none')."
            exit 1
          fi
          # wp-env layers env-scoped mappings over root, so cover root plus development and tests — otherwise a consumer's env.tests mapping shadows the built artifact and the E2E runs against source.
          override="${config%.json}.override.json"
          jq -n --arg key "$key" --arg built "$BUILT_PATH" '{core: null, mappings: {($key): $built}, env: {development: {mappings: {($key): $built}}, tests: {mappings: {($key): $built}}}}' > "$override"
          echo "Generated $override:"
          cat "$override"

      - name: Start wp-env
        working-directory: ${{ inputs.project-path }}
        run: |
          args=()
          if [ -n "$WP_ENV_CONFIG_FILE" ]; then
            args+=(--config "$WP_ENV_CONFIG_FILE")
          fi
          ./node_modules/.bin/wp-env "${args[@]}" start

      - name: Activate the built artifact
        working-directory: ${{ inputs.project-path }}
        env:
          REQUIRES_SCOPED: ${{ needs.build.outputs.requires-scoped }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          target="wp-content/plugins/$PLUGIN_SLUG"
          args=()
          if [ -n "$WP_ENV_CONFIG_FILE" ]; then
            args+=(--config "$WP_ENV_CONFIG_FILE")
          fi
          run_cli() { ./node_modules/.bin/wp-env "${args[@]}" run cli "$@"; }
          if [ "$REQUIRES_SCOPED" = "true" ]; then
            run_cli test -f "$target/vendor-prefixed/scoper-autoload.php"
          fi
          if run_cli test -f "$target/composer.json"; then
            echo "::error::Mounted plugin has composer.json — wp-env is serving the source tree, not the built zip."
            exit 1
          fi
          if run_cli test -d "$target/tests"; then
            echo "::error::Mounted plugin has tests/ — wp-env is serving the source tree, not the built zip."
            exit 1
          fi
          run_cli wp plugin activate "$PLUGIN_SLUG"
          # shellcheck disable=SC2016
          run_cli bash -c 'got=$(wp plugin get "$1" --field=version); echo "Active plugin version: $got (expected $2)"; test "$got" = "$2"' -- "$PLUGIN_SLUG" "$VERSION"

      - name: Assert the site serves
        working-directory: ${{ inputs.project-path }}
        run: |
          # A boot-path fatal that survives activation surfaces on the next request. The consumer's
          # config governs the development port — the override file never touches it.
          port=$(jq -r '.env.development.port // .port // 8888' "${WP_ENV_CONFIG_FILE:-.wp-env.json}")
          curl --fail --silent --show-error --output /dev/null "http://localhost:${port}/"

      - name: Run E2E tests against built artifact
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ -d node_modules/@playwright/test ]; then
            npx --no-install playwright install --with-deps chromium
          fi
          npm run test:e2e --if-present

  provenance:
    name: Verify release provenance
    # A dispatched dry run rehearses this check; a pull request's merge commit has no push runs, and a push-triggered dry run would race the runs it looks up.
    if: ${{ inputs.publish || github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
    steps:
      # A release reuses the suites proven at the exact released commit instead of running them again.
      - name: Verify required workflows passed
        env:
          GH_TOKEN: ${{ github.token }}
          REPOSITORY: ${{ github.repository }}
          SHA: ${{ github.sha }}
          REQUIRED_WORKFLOWS: ${{ inputs.required-workflows }}
        run: |
          if ! jq -e 'type == "array" and length > 0 and all(.[]; type == "string")' <<< "$REQUIRED_WORKFLOWS" > /dev/null; then
            echo "::error::required-workflows must be a non-empty JSON array of workflow file paths — got '$REQUIRED_WORKFLOWS'."
            exit 1
          fi
          if ! successful_workflows=$(gh api --paginate --method GET \
            --header "Accept: application/vnd.github+json" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$REPOSITORY/actions/runs" \
            --raw-field "head_sha=$SHA" \
            --raw-field status=success \
            --field per_page=100 \
            --jq '.workflow_runs[] | select(.event == "push" and .conclusion == "success") | .path'); then
            echo "::error::Unable to list the workflow runs of $SHA; rerun the release once the Actions API is available."
            exit 1
          fi
          missing=()
          while IFS= read -r workflow; do
            if ! grep -Fqx -- "$workflow" <<< "$successful_workflows"; then
              missing+=("$workflow")
            fi
          done < <(jq -r '.[]' <<< "$REQUIRED_WORKFLOWS")
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error::$SHA has no successful push run of ${missing[*]}. Release a commit whose required workflows passed."
            exit 1
          fi

  release:
    name: Publish GitHub release
    needs: [build, test, provenance]
    if: ${{ inputs.publish }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      PLUGIN_SLUG: ${{ inputs.plugin-slug }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download built artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plugin-slug }}-zip
          path: ./dist

      - name: Verify artifact digest
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          actual_digest=$(sha256sum "./dist/$PLUGIN_SLUG.zip" | awk '{print $1}')
          if [ "$actual_digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error::Zip digest mismatch — expected '$EXPECTED_DIGEST', got '$actual_digest'."
            exit 1
          fi

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          CHANGELOG: ${{ inputs.project-path }}/CHANGELOG.md
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          args=(--repo "$GITHUB_REPOSITORY" --verify-tag)
          if [ -f "$CHANGELOG" ]; then
            # index() matches the heading as text; a regex would read the version's dots as wildcards.
            awk -v v="$VERSION" '
              $0 == "## " v || index($0, "## " v " ") == 1 || index($0, "## [" v "]") == 1 { capture = 1; next }
              capture && /^## / { exit }
              capture { print }
            ' "$CHANGELOG" > "$RUNNER_TEMP/release-notes.md"
            if [ ! -s "$RUNNER_TEMP/release-notes.md" ]; then
              echo "::error::$CHANGELOG has no section for $VERSION, so the release would describe nothing."
              exit 1
            fi
            args+=(--notes-file "$RUNNER_TEMP/release-notes.md")
          else
            args+=(--generate-notes)
          fi
          gh release create "$GITHUB_REF_NAME" "./dist/$PLUGIN_SLUG.zip" "${args[@]}"

  wp-org:
    name: Deploy to wp.org
    needs: [build, test, provenance, release]
    if: ${{ inputs.publish && inputs.wp-org }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: wp-org-release
    permissions: {}
    env:
      PLUGIN_SLUG: ${{ inputs.plugin-slug }}
    steps:
      - name: Download built artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plugin-slug }}-zip
          path: ./dist

      - name: Download wp.org assets artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plugin-slug }}-wp-org-assets
          path: ./wp-org-assets

      - name: Verify artifact digest
        env:
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          actual_digest=$(sha256sum "./dist/$PLUGIN_SLUG.zip" | awk '{print $1}')
          if [ "$actual_digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error::Zip digest mismatch — expected '$EXPECTED_DIGEST', got '$actual_digest'."
            exit 1
          fi

      - name: Re-verify version tag before deploy
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          printf '%s' "$REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$' || { echo "::error::Refusing to deploy from non-version ref '$REF_NAME'."; exit 1; }
          echo "VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Verify SVN credentials
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          if [ -z "$SVN_USERNAME" ] || [ -z "$SVN_PASSWORD" ]; then
            echo "::error::Missing SVN credentials — create environment wp-org-release in the calling repository with secrets SVN_USERNAME and SVN_PASSWORD."
            exit 1
          fi

      - name: Extract verified artifact for publish
        run: |
          rm -rf ./publish
          mkdir -p ./publish
          unzip -q "./dist/$PLUGIN_SLUG.zip" -d ./publish
          test -d "./publish/$PLUGIN_SLUG"

      - name: Prepare wp.org assets
        run: |
          find ./wp-org-assets -type f -name __artifact_keep__ -delete
          if ! find ./wp-org-assets -mindepth 1 -print -quit | grep -q .; then
            rmdir ./wp-org-assets
          fi

      - name: Deploy to wp.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          generate-zip: false
          dry-run: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ inputs.plugin-slug }}
          VERSION: ${{ env.VERSION }}
          BUILD_DIR: ./publish/${{ inputs.plugin-slug }}
          ASSETS_DIR: ./wp-org-assets
