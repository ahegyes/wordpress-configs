name: Release to wp.org

on:
  workflow_call:
    inputs:
      plugin-slug:
        description: 'Plugin slug on wp.org (matches the plugin directory name)'
        type: string
        required: true
      plugin-path:
        description: 'Path to the plugin (relative to repo root)'
        type: string
        required: false
        default: '.'
      php-version:
        description: 'PHP version for build steps'
        type: string
        required: false
        default: '8.5'
    secrets:
      SVN_USERNAME:
        description: 'wp.org SVN username'
        required: true
      SVN_PASSWORD:
        description: 'wp.org SVN password'
        required: true

# Serialize releases per plugin slug — two concurrent runs would race for the same SVN tag/trunk.
# Different plugin slugs can release in parallel. Don't cancel mid-deploy: a half-pushed SVN tag is worse than queueing.
concurrency:
  group: release-${{ inputs.plugin-slug }}
  cancel-in-progress: false

# Default workflow-level: read-only. test-and-deploy widens to contents: write per job.
permissions:
  contents: read

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.archive.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2, wp-cli

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.plugin-path }}/package-lock.json

      - name: Install Composer dependencies
        uses: ramsey/composer-install@v4
        with:
          working-directory: ${{ inputs.plugin-path }}
          composer-options: '--prefer-dist --no-dev'

      - name: Install npm dependencies
        working-directory: ${{ inputs.plugin-path }}
        run: npm ci

      - name: Build assets
        working-directory: ${{ inputs.plugin-path }}
        run: npm run build

      - name: Create plugin archive
        id: archive
        working-directory: ${{ inputs.plugin-path }}
        run: |
          wp dist-archive . "${{ inputs.plugin-slug }}.zip"
          echo "artifact-name=${{ inputs.plugin-slug }}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.plugin-slug }}-zip
          path: ${{ inputs.plugin-path }}/${{ inputs.plugin-slug }}.zip
          retention-days: 30

  test-and-deploy:
    name: Test built artifact + deploy
    needs: build
    runs-on: ubuntu-latest
    # softprops/action-gh-release creates a GitHub Release with the built zip attached → needs contents: write.
    # SVN deploy uses repo secrets, not GITHUB_TOKEN, so no extra scope.
    permissions:
      contents: write
    # Source provides the E2E runner (tests/, playwright.config, .wp-env.json, package.json) and wp.org assets (.wordpress-org/).
    # The built zip is the system under test — wp-env is redirected via .wp-env.override.json to mount it instead of source.
    # Deploy reuses the same extracted tree (./built/<slug>/) — what gets tested is what gets pushed to SVN.
    steps:
      - uses: actions/checkout@v6

      - name: Download built artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.plugin-slug }}-zip
          path: ./dist

      - name: Extract artifact
        run: unzip -q "./dist/${{ inputs.plugin-slug }}.zip" -d ./built

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.plugin-path }}/package-lock.json

      - name: Install npm dependencies (E2E runner)
        working-directory: ${{ inputs.plugin-path }}
        run: npm ci

      - name: Redirect wp-env at built artifact (preserves co-mounted plugins)
        working-directory: ${{ inputs.plugin-path }}
        env:
          BUILT_PATH: ${{ github.workspace }}/built/${{ inputs.plugin-slug }}
        run: |
          # Override replaces plugins[] wholesale, so we rebuild it:
          # drop source's self-mount entries (./ or .), append the built path.
          if [ -f .wp-env.json ]; then
            jq --arg built "$BUILT_PATH" \
              '{plugins: ((.plugins // []) | map(select(. != "./" and . != ".")) + [$built])}' \
              .wp-env.json > .wp-env.override.json
          else
            jq -n --arg built "$BUILT_PATH" '{plugins: [$built]}' > .wp-env.override.json
          fi
          echo "Generated .wp-env.override.json:"
          cat .wp-env.override.json

      - name: Start wp-env
        working-directory: ${{ inputs.plugin-path }}
        run: npx --yes @wordpress/env start

      - name: Run E2E tests against built artifact
        working-directory: ${{ inputs.plugin-path }}
        run: |
          if [ -f playwright.config.js ] || [ -f playwright.config.ts ]; then
            npx playwright install --with-deps chromium
            npx playwright test
          else
            echo "Source has no E2E config — wp-env smoke test (above) is the only artifact test."
          fi

      - name: Deploy to wp.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          generate-zip: false
          dry-run: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ inputs.plugin-slug }}
          BUILD_DIR: ./built/${{ inputs.plugin-slug }}
          # Banner/icon assets from source's .wordpress-org/ — 10up's deploy.sh skips silently if the directory is missing.
          ASSETS_DIR: ${{ inputs.plugin-path }}/.wordpress-org

      - name: Attach artifact to GitHub release
        uses: softprops/action-gh-release@b4309332981a82ec1c5618f44dd2e27cc8bfbfda # v3.0.0
        with:
          files: ./dist/${{ inputs.plugin-slug }}.zip
