name: Release to wp.org

on:
  workflow_call:
    inputs:
      plugin-slug:
        description: 'Plugin slug on wp.org (matches the plugin directory name and the <slug>.php main file)'
        type: string
        required: true
      project-path:
        description: 'Path to the project (relative to repo root)'
        type: string
        required: false
        default: '.'
      scoped-dependencies-dir:
        description: 'Project-relative php-scoper output directory that contains scoper-autoload.php'
        type: string
        required: false
        default: 'dependencies'
      php-version:
        description: 'PHP version for build steps'
        type: string
        required: false
        default: '8.5'
      requires-scoped-dependencies:
        description: 'Whether the archive must include scoped dependencies; plugins bundling scoped third-party deps keep the default, set false for plugins without the scoping pipeline'
        type: boolean
        required: false
        default: true
      plugin-check:
        description: 'Whether to run WordPress Plugin Check against the built plugin archive'
        type: boolean
        required: false
        default: true
      generate-pot:
        description: 'Regenerate languages/<domain>.pot via wp i18n make-pot before archive creation; set false only for plugins with no translatable strings'
        type: boolean
        required: false
        default: true
      pot-domain:
        description: 'Text domain for POT generation; empty derives it from plugin-slug (the wp.org convention Plugin Check enforces)'
        type: string
        required: false
        default: ''

concurrency:
  group: release-${{ inputs.plugin-slug }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  WP_ENV_VERSION: '11.9.0'

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      digest: ${{ steps.archive-digest.outputs.digest }}
      version: ${{ steps.release-inputs.outputs.version }}
    steps:
      - name: Enforce release inputs
        id: release-inputs
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
          PROJECT_PATH: ${{ inputs.project-path }}
          SCOPED_DEPENDENCIES_DIR: ${{ inputs.scoped-dependencies-dir }}
        run: |
          # Slash-wrap so a `..` segment anywhere (start, middle, end, or whole) is caught.
          has_dotdot_segment() {
            case "/$1/" in
              */../*) return 0 ;;
              *) return 1 ;;
            esac
          }

          validate_path_input() {
            name="$1"
            value="$2"
            if ! printf '%s' "$value" | grep -Eq '^[A-Za-z0-9._/-]+$'; then
              echo "::error::$name must match ^[A-Za-z0-9._/-]+$ — got '$value'."
              exit 1
            fi
            case "$value" in
              /*)
                echo "::error::$name must be relative — got '$value'."
                exit 1
                ;;
            esac
            if has_dotdot_segment "$value"; then
              echo "::error::$name must not contain a .. path segment — got '$value'."
              exit 1
            fi
          }

          if [ "$REF_TYPE" != "tag" ] || ! printf '%s' "$REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$'; then
            echo "::error::Releases run from version tags only (vMAJOR.MINOR.PATCH, no leading zeros) — got $REF_TYPE '$REF_NAME'."
            exit 1
          fi
          if ! printf '%s' "$PLUGIN_SLUG" | grep -Eq '^[a-z0-9-]+$'; then
            echo "::error::plugin-slug must match ^[a-z0-9-]+$ — got '$PLUGIN_SLUG'."
            exit 1
          fi
          validate_path_input 'project-path' "$PROJECT_PATH"
          validate_path_input 'scoped-dependencies-dir' "$SCOPED_DEPENDENCIES_DIR"

          version="${REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify .distignore exists
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ ! -f .distignore ]; then
            echo "::error::Missing .distignore — refusing to build a wp.org archive without explicit file exclusions."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2, wp-cli

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # zizmor: ignore[cache-poisoning] setup-node auto-cache accepted because the artifact is tested before publish (v6.4.0)
        with:
          node-version: '26'

      - name: Install Composer dependencies (dev — runs the scoping pipeline)
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: ${{ inputs.project-path }}
          composer-options: '--prefer-dist --ignore-platform-req=php+'

      - name: Build assets
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build --if-present
          else
            echo "No package.json — skipping asset build."
          fi

      - name: Generate POT
        if: ${{ inputs.generate-pot }}
        working-directory: ${{ inputs.project-path }}
        env:
          POT_DOMAIN: ${{ inputs.pot-domain != '' && inputs.pot-domain || inputs.plugin-slug }}
          REQUIRES_SCOPED: ${{ inputs.requires-scoped-dependencies }}
          SCOPED_DEPENDENCIES_DIR: ${{ inputs.scoped-dependencies-dir }}
        run: |
          if ! printf '%s' "$POT_DOMAIN" | grep -Eq '^[a-z0-9_-]+$'; then
            echo "::error::pot-domain must match ^[a-z0-9_-]+$ — got '$POT_DOMAIN'."
            exit 1
          fi
          mkdir -p languages
          wp i18n make-pot . "languages/$POT_DOMAIN.pot" --domain="$POT_DOMAIN"
          if [ "$REQUIRES_SCOPED" = "true" ] \
            && [ -d "$SCOPED_DEPENDENCIES_DIR" ] \
            && grep -rql --include='*.php' "'$POT_DOMAIN'" "$SCOPED_DEPENDENCIES_DIR" \
            && ! grep -Fq "#: $SCOPED_DEPENDENCIES_DIR/" "languages/$POT_DOMAIN.pot"; then
            echo "::warning::$SCOPED_DEPENDENCIES_DIR/ carries strings under '$POT_DOMAIN' but the generated POT has no $SCOPED_DEPENDENCIES_DIR/ source references."
          fi

      - name: Verify version consistency
        working-directory: ${{ inputs.project-path }}
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: |
          HEADER_VERSION=$(sed -nE 's|^[[:space:]/*#@]*[Vv]ersion:[[:space:]]*([^[:space:]]+).*$|\1|p' "$PLUGIN_SLUG.php" | head -n 1)
          STABLE_TAG=$(sed -nE 's|^[[:space:]]*[Ss]table [Tt]ag:[[:space:]]*([^[:space:]]+).*$|\1|p' readme.txt | head -n 1)
          if [ "$VERSION" != "$HEADER_VERSION" ] || [ "$VERSION" != "$STABLE_TAG" ]; then
            echo "::error::Version mismatch — tag: '$VERSION', $PLUGIN_SLUG.php Version header: '$HEADER_VERSION', readme.txt Stable tag: '$STABLE_TAG'."
            exit 1
          fi

      # --no-scripts avoids invoking handlers that were just pruned from require-dev.
      - name: Prune to production dependencies
        working-directory: ${{ inputs.project-path }}
        run: composer install --no-dev --prefer-dist --ignore-platform-req=php+ --optimize-autoloader --no-scripts

      - name: Create plugin archive
        working-directory: ${{ inputs.project-path }}
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: |
          wp package install wp-cli/dist-archive-command:3.2.2
          wp dist-archive . "./$PLUGIN_SLUG.zip" --plugin-dirname="$PLUGIN_SLUG"

      - name: Assert archive contents
        working-directory: ${{ inputs.project-path }}
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
          REQUIRES_SCOPED: ${{ inputs.requires-scoped-dependencies }}
          SCOPED_DEPENDENCIES_DIR: ${{ inputs.scoped-dependencies-dir }}
        run: |
          entries=$(unzip -Z1 "$PLUGIN_SLUG.zip")
          status=0

          if [ "$REQUIRES_SCOPED" = "true" ]; then
            required_scoped="$PLUGIN_SLUG/$SCOPED_DEPENDENCIES_DIR/scoper-autoload.php"
            if ! printf '%s\n' "$entries" | grep -qxF "$required_scoped"; then
              echo "::error::Archive is missing $required_scoped."
              status=1
            fi
          fi

          for required in \
            "$PLUGIN_SLUG/vendor/autoload.php" \
            "$PLUGIN_SLUG/$PLUGIN_SLUG.php" \
            "$PLUGIN_SLUG/readme.txt"; do
            if ! printf '%s\n' "$entries" | grep -qxF "$required"; then
              echo "::error::Archive is missing $required."
              status=1
            fi
          done

          if [ "$REQUIRES_SCOPED" = "true" ]; then
            if [ ! -d "$SCOPED_DEPENDENCIES_DIR" ]; then
              echo "::error::No $SCOPED_DEPENDENCIES_DIR/ directory — the scoping pipeline did not run."
              status=1
            else
              scoped_package_roots=$(
                if [ -f "$SCOPED_DEPENDENCIES_DIR/composer.json" ]; then
                  printf '%s\n' "$SCOPED_DEPENDENCIES_DIR"
                else
                  find "$SCOPED_DEPENDENCIES_DIR" -mindepth 2 -maxdepth 2 -type f -name composer.json -exec dirname {} \;
                  find "$SCOPED_DEPENDENCIES_DIR" -mindepth 3 -maxdepth 3 -type f -name composer.json -exec dirname {} \;
                fi | LC_ALL=C sort -u
              )
              if [ -z "$scoped_package_roots" ]; then
                echo "::error::No scoped package roots found under $SCOPED_DEPENDENCIES_DIR/."
                status=1
              else
                while IFS= read -r pkg; do
                  [ -n "$pkg" ] || continue
                  pkg_entries=$(
                    printf '%s\n' "$entries" \
                      | grep -F -- "$PLUGIN_SLUG/$pkg/" \
                      | grep '[^/]$' || true
                  )
                  if [ "$pkg" = "$SCOPED_DEPENDENCIES_DIR" ]; then
                    pkg_entries=$(printf '%s\n' "$pkg_entries" | grep -vxF "$PLUGIN_SLUG/$SCOPED_DEPENDENCIES_DIR/scoper-autoload.php" || true)
                  fi
                  if [ -z "$pkg_entries" ]; then
                    echo "::error::Archive is missing scoped package $pkg/."
                    status=1
                  fi
                done <<< "$scoped_package_roots"
              fi
            fi
          fi

          while IFS= read -r entry; do
            case "$entry" in
              "$PLUGIN_SLUG/node_modules/"*|"$PLUGIN_SLUG/"*/node_modules/*|"$PLUGIN_SLUG/tests/"*|"$PLUGIN_SLUG/"*/tests/*|"$PLUGIN_SLUG/vendor/bin/"*|"$PLUGIN_SLUG/"*/vendor/bin/*)
                echo "::error::Archive must not contain $entry."
                status=1
                ;;
              "$PLUGIN_SLUG/.git/"*|"$PLUGIN_SLUG/.github/"*|"$PLUGIN_SLUG/.idea/"*|"$PLUGIN_SLUG/.vscode/"*|"$PLUGIN_SLUG/.wordpress-org/"*)
                echo "::error::Archive must not contain $entry."
                status=1
                ;;
              "$PLUGIN_SLUG/.editorconfig"|"$PLUGIN_SLUG/.gitattributes"|"$PLUGIN_SLUG/.gitignore"|"$PLUGIN_SLUG/.distignore")
                echo "::error::Archive must not contain $entry."
                status=1
                ;;
              "$PLUGIN_SLUG/composer.json"|"$PLUGIN_SLUG/composer.lock"|"$PLUGIN_SLUG/package.json"|"$PLUGIN_SLUG/package-lock.json")
                echo "::error::Archive must not contain $entry."
                status=1
                ;;
              "$PLUGIN_SLUG/.phpcs.xml"|"$PLUGIN_SLUG/phpcs.dist.xml"|"$PLUGIN_SLUG/.phpstan.neon"|"$PLUGIN_SLUG/phpstan.dist.neon")
                echo "::error::Archive must not contain $entry."
                status=1
                ;;
              "$PLUGIN_SLUG/phpunit.xml"|"$PLUGIN_SLUG/phpunit.xml."*|"$PLUGIN_SLUG/infection.json"|"$PLUGIN_SLUG/infection.json."*)
                echo "::error::Archive must not contain $entry."
                status=1
                ;;
              "$PLUGIN_SLUG/eslint.config."*|"$PLUGIN_SLUG/stylelint.config."*|"$PLUGIN_SLUG/tsconfig.json"|"$PLUGIN_SLUG/playwright.config."*)
                echo "::error::Archive must not contain $entry."
                status=1
                ;;
              "$PLUGIN_SLUG/scoper.inc.php"|"$PLUGIN_SLUG/scoping-exclusions.json"|"$PLUGIN_SLUG/.wp-env"*)
                echo "::error::Archive must not contain $entry."
                status=1
                ;;
            esac
          done <<< "$entries"

          exit "$status"

      - name: Record archive digest
        id: archive-digest
        working-directory: ${{ inputs.project-path }}
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: |
          digest=$(sha256sum "$PLUGIN_SLUG.zip" | awk '{print $1}')
          echo "digest=$digest" >> "$GITHUB_OUTPUT"

      - name: Prepare Plugin Check build
        if: ${{ inputs.plugin-check }}
        working-directory: ${{ inputs.project-path }}
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: |
          rm -rf plugin-check-build
          unzip -q "$PLUGIN_SLUG.zip" -d ./plugin-check-build

      - name: Run Plugin Check
        if: ${{ inputs.plugin-check }}
        uses: WordPress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2 # v1.1.7
        with:
          build-dir: ${{ inputs.project-path }}/plugin-check-build/${{ inputs.plugin-slug }}

      - name: Prepare wp.org assets artifact
        working-directory: ${{ inputs.project-path }}
        run: |
          rm -rf wp-org-assets-artifact
          mkdir -p wp-org-assets-artifact
          if [ -d .wordpress-org ]; then
            cp -R .wordpress-org/. wp-org-assets-artifact/
          fi
          touch wp-org-assets-artifact/__artifact_keep__

      - name: Upload zip artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.plugin-slug }}-zip
          path: ${{ inputs.project-path }}/${{ inputs.plugin-slug }}.zip
          retention-days: 30

      - name: Upload wp.org assets artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.plugin-slug }}-wp-org-assets
          path: ${{ inputs.project-path }}/wp-org-assets-artifact/**
          retention-days: 30

  test:
    name: Test built artifact
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download built artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plugin-slug }}-zip
          path: ./dist

      - name: Verify artifact digest
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          actual_digest=$(sha256sum "./dist/$PLUGIN_SLUG.zip" | awk '{print $1}')
          if [ "$actual_digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error::Zip digest mismatch — expected '$EXPECTED_DIGEST', got '$actual_digest'."
            exit 1
          fi

      - name: Extract artifact
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: unzip -q "./dist/$PLUGIN_SLUG.zip" -d ./built-test

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # zizmor: ignore[cache-poisoning] setup-node auto-cache accepted because the published artifact is the verified zip from build (v6.4.0)
        with:
          node-version: '26'

      - name: Install Composer dependencies (E2E harness)
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # zizmor: ignore[cache-poisoning] cache feeds only the E2E harness (4.0.0)
        with:
          working-directory: ${{ inputs.project-path }}
          composer-options: '--prefer-dist --ignore-platform-req=php+'

      - name: Install npm dependencies (E2E runner)
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json — skipping npm install."
          fi

      - name: Redirect wp-env at built artifact
        working-directory: ${{ inputs.project-path }}
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
          BUILT_PATH: ${{ github.workspace }}/built-test/${{ inputs.plugin-slug }}
        run: |
          key="wp-content/plugins/$PLUGIN_SLUG"
          if [ ! -f .wp-env.json ] || ! jq -e --arg key "$key" '.mappings | has($key)' .wp-env.json > /dev/null; then
            echo "::error::Release contract violation — .wp-env.json must exist and map \"$key\" to the plugin source; found mappings: $(jq -c '.mappings // {}' .wp-env.json 2> /dev/null || echo 'none')."
            exit 1
          fi
          jq -n --arg key "$key" --arg built "$BUILT_PATH" '{core: null, mappings: {($key): $built}}' > .wp-env.override.json
          echo "Generated .wp-env.override.json:"
          cat .wp-env.override.json

      - name: Start wp-env
        working-directory: ${{ inputs.project-path }}
        run: npx --yes @wordpress/env@"$WP_ENV_VERSION" start

      - name: Assert the mounted plugin is the built artifact
        working-directory: ${{ inputs.project-path }}
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
          REQUIRES_SCOPED: ${{ inputs.requires-scoped-dependencies }}
          SCOPED_DEPENDENCIES_DIR: ${{ inputs.scoped-dependencies-dir }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          target="wp-content/plugins/$PLUGIN_SLUG"
          run_cli() { npx --yes @wordpress/env@"$WP_ENV_VERSION" run cli "$@"; }
          if [ "$REQUIRES_SCOPED" = "true" ]; then
            run_cli test -f "$target/$SCOPED_DEPENDENCIES_DIR/scoper-autoload.php"
          fi
          if run_cli test -f "$target/composer.json"; then
            echo "::error::Mounted plugin has composer.json — wp-env is serving the source tree, not the built zip."
            exit 1
          fi
          if run_cli test -d "$target/tests"; then
            echo "::error::Mounted plugin has tests/ — wp-env is serving the source tree, not the built zip."
            exit 1
          fi
          run_cli wp plugin is-active "$PLUGIN_SLUG"
          # shellcheck disable=SC2016
          run_cli bash -c 'got=$(wp plugin get "$1" --field=version); echo "Active plugin version: $got (expected $2)"; test "$got" = "$2"' -- "$PLUGIN_SLUG" "$VERSION"

      - name: Run E2E tests against built artifact
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ -f playwright.config.js ] || [ -f playwright.config.ts ]; then
            npx --no-install playwright install --with-deps chromium
            npx --no-install playwright test
          else
            echo "Source has no E2E config — the artifact assertions above are the only artifact test."
          fi

  deploy:
    name: Deploy verified artifact
    needs: [build, test]
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    environment: wp-org-release
    permissions:
      contents: write
    steps:
      - name: Download built artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plugin-slug }}-zip
          path: ./dist

      - name: Download wp.org assets artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plugin-slug }}-wp-org-assets
          path: ./wp-org-assets

      - name: Verify artifact digest
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
          EXPECTED_DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          actual_digest=$(sha256sum "./dist/$PLUGIN_SLUG.zip" | awk '{print $1}')
          if [ "$actual_digest" != "$EXPECTED_DIGEST" ]; then
            echo "::error::Zip digest mismatch — expected '$EXPECTED_DIGEST', got '$actual_digest'."
            exit 1
          fi

      - name: Re-verify version tag before deploy
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          printf '%s' "$REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$' || { echo "::error::Refusing to deploy from non-version ref '$REF_NAME'."; exit 1; }
          echo "VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Verify SVN credentials
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          if [ -z "$SVN_USERNAME" ] || [ -z "$SVN_PASSWORD" ]; then
            echo "::error::Missing SVN credentials — create environment wp-org-release in the calling repository with secrets SVN_USERNAME and SVN_PASSWORD."
            exit 1
          fi

      - name: Extract verified artifact for publish
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: |
          rm -rf ./publish
          mkdir -p ./publish
          unzip -q "./dist/$PLUGIN_SLUG.zip" -d ./publish
          test -d "./publish/$PLUGIN_SLUG"

      - name: Prepare wp.org assets
        run: |
          find ./wp-org-assets -type f -name __artifact_keep__ -delete
          if ! find ./wp-org-assets -mindepth 1 -print -quit | grep -q .; then
            rmdir ./wp-org-assets
          fi

      - name: Deploy to wp.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          generate-zip: false
          dry-run: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ inputs.plugin-slug }}
          VERSION: ${{ env.VERSION }}
          BUILD_DIR: ./publish/${{ inputs.plugin-slug }}
          ASSETS_DIR: ./wp-org-assets

      - name: Attach artifact to GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # zizmor: ignore[superfluous-actions] deliberate release creation and asset upload are one reviewed action (v2.3.3)
        with:
          files: ./dist/${{ inputs.plugin-slug }}.zip
