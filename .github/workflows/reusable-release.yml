name: Release to wp.org

on:
  workflow_call:
    inputs:
      plugin-slug:
        description: 'Plugin slug on wp.org (matches the plugin directory name)'
        type: string
        required: true
      plugin-path:
        description: 'Path to the plugin (relative to repo root)'
        type: string
        required: false
        default: '.'
      php-version:
        description: 'PHP version for build steps'
        type: string
        required: false
        default: '8.5'
    secrets:
      SVN_USERNAME:
        description: 'wp.org SVN username'
        required: true
      SVN_PASSWORD:
        description: 'wp.org SVN password'
        required: true

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    outputs:
      artifact-name: ${{ steps.archive.outputs.artifact-name }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2, wp-cli

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: ${{ inputs.plugin-path }}/package-lock.json

      - name: Install Composer dependencies (production only)
        uses: ramsey/composer-install@v4
        with:
          working-directory: ${{ inputs.plugin-path }}
          composer-options: '--prefer-dist --no-dev'

      - name: Install npm dependencies
        working-directory: ${{ inputs.plugin-path }}
        run: npm ci

      - name: Build assets
        working-directory: ${{ inputs.plugin-path }}
        run: npm run build

      - name: Create plugin archive (.distignore-aware)
        id: archive
        working-directory: ${{ inputs.plugin-path }}
        run: |
          wp dist-archive . "${{ inputs.plugin-slug }}.zip"
          echo "artifact-name=${{ inputs.plugin-slug }}.zip" >> "$GITHUB_OUTPUT"

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ inputs.plugin-slug }}-zip
          path: ${{ inputs.plugin-path }}/${{ inputs.plugin-slug }}.zip
          retention-days: 30

  test-built-artifact:
    name: Test built artifact
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download built artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.plugin-slug }}-zip
          path: ./dist

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'

      - name: Extract artifact into wp-env mapping
        run: |
          mkdir -p .built-plugin
          unzip -q "./dist/${{ inputs.plugin-slug }}.zip" -d .built-plugin

      - name: Start wp-env against the built artifact
        working-directory: .built-plugin/${{ inputs.plugin-slug }}
        run: npx --yes @wordpress/env start

      - name: Run E2E tests against built artifact
        working-directory: .built-plugin/${{ inputs.plugin-slug }}
        run: |
          if [ -f playwright.config.js ] || [ -f playwright.config.ts ]; then
            npx playwright install --with-deps chromium
            npx playwright test
          else
            echo "No Playwright config in shipped artifact — skipping."
          fi

  deploy:
    name: Deploy to wp.org
    needs: [build, test-built-artifact]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          path: source

      - name: Download built artifact
        uses: actions/download-artifact@v8
        with:
          name: ${{ inputs.plugin-slug }}-zip
          path: ./dist

      - name: Extract artifact for deploy
        run: |
          mkdir -p ./deploy
          unzip -q "./dist/${{ inputs.plugin-slug }}.zip" -d ./deploy

      - name: Deploy to wp.org
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: false
          dry-run: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ inputs.plugin-slug }}
          BUILD_DIR: ./deploy/${{ inputs.plugin-slug }}

      - name: Attach artifact to GitHub release
        uses: softprops/action-gh-release@v3
        with:
          files: ./dist/${{ inputs.plugin-slug }}.zip
