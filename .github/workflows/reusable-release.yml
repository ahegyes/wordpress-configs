name: Release to wp.org

on:
  workflow_call:
    inputs:
      plugin-slug:
        description: 'Plugin slug on wp.org (matches the plugin directory name and the <slug>.php main file)'
        type: string
        required: true
      project-path:
        description: 'Path to the project (relative to repo root)'
        type: string
        required: false
        default: '.'
      php-version:
        description: 'PHP version for build steps'
        type: string
        required: false
        default: '8.5'
      requires-scoped-dependencies:
        description: 'Whether the archive must include scoped dependencies; plugins bundling scoped third-party deps keep the default, set false for plugins without the scoping pipeline'
        type: boolean
        required: false
        default: true
      plugin-check:
        description: 'Whether to run WordPress Plugin Check against the built plugin archive'
        type: boolean
        required: false
        default: true
      generate-pot:
        description: 'Regenerate languages/<domain>.pot via wp i18n make-pot before archive creation; set false only for plugins with no translatable strings'
        type: boolean
        required: false
        default: true
      pot-domain:
        description: 'Text domain for POT generation; empty derives it from plugin-slug (the wp.org convention Plugin Check enforces)'
        type: string
        required: false
        default: ''

# Queue per plugin slug so concurrent runs do not race the same SVN tag/trunk; a half-pushed SVN tag is worse than waiting.
concurrency:
  group: release-${{ inputs.plugin-slug }}
  cancel-in-progress: false

# Default workflow-level: read-only. test-and-deploy widens to contents: write per job.
permissions:
  contents: read

env:
  # Single-sourced here because npx-inline versions are invisible to dependabot.
  WP_ENV_VERSION: '11.9.0'

jobs:
  build:
    name: Build artifact
    runs-on: ubuntu-latest
    steps:
      # Reject malformed release inputs early; leading-zero tags compare equal in wp.org update checks.
      - name: Enforce version tag and slug shape
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: |
          if [ "$REF_TYPE" != "tag" ] || ! printf '%s' "$REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$'; then
            echo "::error::Releases run from version tags only (vMAJOR.MINOR.PATCH, no leading zeros) — got $REF_TYPE '$REF_NAME'."
            exit 1
          fi
          # The slug feeds shell commands, jq keys, and grep patterns downstream; a strict charset keeps every use literal.
          if ! printf '%s' "$PLUGIN_SLUG" | grep -Eq '^[a-z0-9-]+$'; then
            echo "::error::plugin-slug must match ^[a-z0-9-]+$ — got '$PLUGIN_SLUG'."
            exit 1
          fi
          echo "VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"

      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify .distignore exists
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ ! -f .distignore ]; then
            echo "::error::Missing .distignore — refusing to build a wp.org archive without explicit file exclusions. Without it, wp dist-archive ships everything including tests/, node_modules/, and dev-only vendor files."
            exit 1
          fi

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2, wp-cli

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # zizmor: ignore[cache-poisoning] setup-node auto-cache accepted — the artifact is built and tested before publish
        with:
          node-version: '26'

      # Dev install runs build-time scoping hooks from require-dev.
      - name: Install Composer dependencies (dev — runs the scoping pipeline)
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # 4.0.0
        with:
          working-directory: ${{ inputs.project-path }}
          composer-options: '--prefer-dist --ignore-platform-req=php+'

      - name: Build assets
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ -f package.json ]; then
            npm ci
            npm run build --if-present
          else
            echo "No package.json — skipping asset build."
          fi

      - name: Generate POT
        if: ${{ inputs.generate-pot }}
        working-directory: ${{ inputs.project-path }}
        env:
          POT_DOMAIN: ${{ inputs.pot-domain != '' && inputs.pot-domain || inputs.plugin-slug }}
          REQUIRES_SCOPED: ${{ inputs.requires-scoped-dependencies }}
        run: |
          if ! printf '%s' "$POT_DOMAIN" | grep -Eq '^[a-z0-9-]+$'; then
            echo "::error::pot-domain must match ^[a-z0-9-]+$ — got '$POT_DOMAIN'."
            exit 1
          fi
          mkdir -p languages
          wp i18n make-pot . "languages/$POT_DOMAIN.pot" --domain="$POT_DOMAIN"
          # Only scoped trees with domain strings must contribute POT references.
          if [ "$REQUIRES_SCOPED" = "true" ] \
            && grep -rql --include='*.php' "'$POT_DOMAIN'" dependencies/ \
            && ! grep -q '^#: dependencies/' "languages/$POT_DOMAIN.pot"; then
            echo "::error::dependencies/ carries strings under '$POT_DOMAIN' but the generated POT has no dependencies/ source references — make-pot did not catalogue the scoped tree."
            exit 1
          fi

      # The tag is the single version source — the shipped metadata must already agree with it.
      - name: Verify version consistency
        working-directory: ${{ inputs.project-path }}
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: |
          HEADER_VERSION=$(sed -nE 's|^[[:space:]/*#@]*[Vv]ersion:[[:space:]]*([^[:space:]]+).*$|\1|p' "$PLUGIN_SLUG.php" | head -n 1)
          STABLE_TAG=$(sed -nE 's|^[[:space:]]*[Ss]table [Tt]ag:[[:space:]]*([^[:space:]]+).*$|\1|p' readme.txt | head -n 1)
          if [ "$VERSION" != "$HEADER_VERSION" ] || [ "$VERSION" != "$STABLE_TAG" ]; then
            echo "::error::Version mismatch — tag: '$VERSION', $PLUGIN_SLUG.php Version header: '$HEADER_VERSION', readme.txt Stable tag: '$STABLE_TAG'."
            exit 1
          fi

      # --no-scripts: the require-dev script handlers are pruned by this very install; dependencies/ lives outside vendor/ and survives.
      - name: Prune to production dependencies
        working-directory: ${{ inputs.project-path }}
        run: composer install --no-dev --prefer-dist --ignore-platform-req=php+ --optimize-autoloader --no-scripts

      - name: Create plugin archive
        working-directory: ${{ inputs.project-path }}
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: |
          wp package install wp-cli/dist-archive-command:3.2.2
          # The ./ prefix is load-bearing: a bare filename target makes dist-archive write the zip to the PARENT of the source dir.
          wp dist-archive . "./$PLUGIN_SLUG.zip" --plugin-dirname="$PLUGIN_SLUG"

      # A zip that misses runtime files activates into a blank notice; one that leaks dev files fails wp.org review.
      - name: Assert archive contents
        working-directory: ${{ inputs.project-path }}
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
          REQUIRES_SCOPED: ${{ inputs.requires-scoped-dependencies }}
        run: |
          entries=$(unzip -Z1 "$PLUGIN_SLUG.zip")
          status=0
          if [ "$REQUIRES_SCOPED" = "true" ]; then
            required_scoped="$PLUGIN_SLUG/dependencies/scoper-autoload.php"
            if ! printf '%s\n' "$entries" | grep -qxF "$required_scoped"; then
              echo "::error::Archive is missing $required_scoped."
              status=1
            fi
          fi
          for required in \
            "$PLUGIN_SLUG/vendor/autoload.php" \
            "$PLUGIN_SLUG/$PLUGIN_SLUG.php" \
            "$PLUGIN_SLUG/readme.txt"; do
            if ! printf '%s\n' "$entries" | grep -qxF "$required"; then
              echo "::error::Archive is missing $required."
              status=1
            fi
          done
          # Each scoped package must ship at least one file; package-level checks avoid false failures from nested metadata exclusions.
          if [ "$REQUIRES_SCOPED" = "true" ]; then
            if [ ! -d dependencies ]; then
              echo "::error::No dependencies/ directory — the scoping pipeline did not run."
              status=1
            else
              while IFS= read -r pkg; do
                if ! printf '%s\n' "$entries" | grep -qE "^$PLUGIN_SLUG/$pkg/.*[^/]$"; then
                  echo "::error::Archive is missing scoped package $pkg/."
                  status=1
                fi
              done < <(find dependencies -mindepth 2 -maxdepth 2 -type d | LC_ALL=C sort)
            fi
          fi
          # Anchored to the archive root — an unanchored substring would false-fail on a nested path repeating the slug.
          for forbidden in \
            "vendor/bin/" \
            "node_modules/" \
            "tests/" \
            "composer\.json$" \
            "scoper\.inc\.php$" \
            "\.wp-env"; do
            if printf '%s\n' "$entries" | grep -qE "^$PLUGIN_SLUG/$forbidden"; then
              echo "::error::Archive must not contain $PLUGIN_SLUG/${forbidden//\\/}."
              status=1
            fi
          done
          exit "$status"

      - name: Prepare Plugin Check build
        if: ${{ inputs.plugin-check }}
        working-directory: ${{ inputs.project-path }}
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: |
          rm -rf plugin-check-build
          unzip -q "$PLUGIN_SLUG.zip" -d ./plugin-check-build

      # The gate runs the same checks wp.org applies at review, against the exact tree that ships.
      - name: Run Plugin Check
        if: ${{ inputs.plugin-check }}
        uses: WordPress/plugin-check-action@98a1788320d0add90df2d8183934ecccbc4e05d2 # v1.1.7
        with:
          build-dir: ${{ inputs.project-path }}/plugin-check-build/${{ inputs.plugin-slug }}

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ inputs.plugin-slug }}-zip
          path: ${{ inputs.project-path }}/${{ inputs.plugin-slug }}.zip
          retention-days: 30

  test-and-deploy:
    name: Test built artifact + deploy
    needs: build
    runs-on: ubuntu-latest
    if: github.ref_type == 'tag'
    environment: wp-org-release
    # softprops/action-gh-release creates a GitHub Release with the built zip attached → needs contents: write.
    # SVN deploy uses environment secrets, not GITHUB_TOKEN, so no extra scope.
    permissions:
      contents: write
    # Source stays checked out as the E2E/wp.org-assets harness; deploy uses the extracted artifact tree.
    # Remapping only the plugin's wp-env mapping key keeps co-mounted entries intact.
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Download built artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.plugin-slug }}-zip
          path: ./dist

      - name: Extract artifact
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
        run: unzip -q "./dist/$PLUGIN_SLUG.zip" -d ./built

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ inputs.php-version }}
          coverage: none
          tools: composer:v2

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # zizmor: ignore[cache-poisoning] setup-node auto-cache accepted — the artifact is built and tested before publish
        with:
          node-version: '26'

      # Dev install prepares the source-side E2E harness and any packages .wp-env.json co-mounts.
      - name: Install Composer dependencies (E2E harness)
        uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # zizmor: ignore[cache-poisoning] cache feeds only the E2E harness — the published artifact is the zip from the build job
        with:
          working-directory: ${{ inputs.project-path }}
          composer-options: '--prefer-dist --ignore-platform-req=php+'

      - name: Install npm dependencies (E2E runner)
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ -f package.json ]; then
            npm ci
          else
            echo "No package.json — skipping npm install."
          fi

      - name: Redirect wp-env at built artifact
        working-directory: ${{ inputs.project-path }}
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
          BUILT_PATH: ${{ github.workspace }}/built/${{ inputs.plugin-slug }}
        run: |
          key="wp-content/plugins/$PLUGIN_SLUG"
          # Remap exactly the plugin's mapping key to the built artifact and nothing else.
          if [ ! -f .wp-env.json ] || ! jq -e --arg key "$key" '.mappings | has($key)' .wp-env.json > /dev/null; then
            echo "::error::Release contract violation — .wp-env.json must exist and map \"$key\" to the plugin source; found mappings: $(jq -c '.mappings // {}' .wp-env.json 2> /dev/null || echo 'none')."
            exit 1
          fi
          # core: null pins the release gate to latest stable WordPress even when source targets nightly.
          jq -n --arg key "$key" --arg built "$BUILT_PATH" '{core: null, mappings: {($key): $built}}' > .wp-env.override.json
          echo "Generated .wp-env.override.json:"
          cat .wp-env.override.json

      - name: Start wp-env
        working-directory: ${{ inputs.project-path }}
        run: npx --yes @wordpress/env@"$WP_ENV_VERSION" start

      - name: Assert the mounted plugin is the built artifact
        working-directory: ${{ inputs.project-path }}
        env:
          PLUGIN_SLUG: ${{ inputs.plugin-slug }}
          REF_NAME: ${{ github.ref_name }}
          REQUIRES_SCOPED: ${{ inputs.requires-scoped-dependencies }}
        run: |
          VERSION="${REF_NAME#v}"
          target="wp-content/plugins/$PLUGIN_SLUG"
          run_cli() { npx --yes @wordpress/env@"$WP_ENV_VERSION" run cli "$@"; }
          if [ "$REQUIRES_SCOPED" = "true" ]; then
            run_cli test -f "$target/dependencies/scoper-autoload.php"
          fi
          if run_cli test -f "$target/composer.json"; then
            echo "::error::Mounted plugin has composer.json — wp-env is serving the source tree, not the built zip."
            exit 1
          fi
          if run_cli test -d "$target/tests"; then
            echo "::error::Mounted plugin has tests/ — wp-env is serving the source tree, not the built zip."
            exit 1
          fi
          run_cli wp plugin is-active "$PLUGIN_SLUG"
          # Positional args keep slug/version out of the inner shell's parse; the comparison runs in-container because run_cli output is not capture-clean.
          # shellcheck disable=SC2016
          run_cli bash -c 'got=$(wp plugin get "$1" --field=version); echo "Active plugin version: $got (expected $2)"; test "$got" = "$2"' -- "$PLUGIN_SLUG" "$VERSION"

      - name: Run E2E tests against built artifact
        working-directory: ${{ inputs.project-path }}
        run: |
          if [ -f playwright.config.js ] || [ -f playwright.config.ts ]; then
            npx --no-install playwright install --with-deps chromium
            npx --no-install playwright test
          else
            echo "Source has no E2E config — the artifact assertions above are the only artifact test."
          fi

      # Defense-in-depth: deploy must be unreachable from a non-version ref even if the job-level gate changes.
      - name: Re-verify version tag before deploy
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          printf '%s' "$REF_NAME" | grep -Eq '^v(0|[1-9][0-9]*)(\.(0|[1-9][0-9]*)){2}$' || { echo "::error::Refusing to deploy from non-version ref '$REF_NAME'."; exit 1; }
          echo "VERSION=${REF_NAME#v}" >> "$GITHUB_ENV"

      # Secrets resolve from the CALLER repo's wp-org-release environment — environment secrets cannot travel through workflow_call.
      - name: Verify SVN credentials
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
        run: |
          if [ -z "$SVN_USERNAME" ] || [ -z "$SVN_PASSWORD" ]; then
            echo "::error::Missing SVN credentials — create environment wp-org-release in the calling repository with secrets SVN_USERNAME and SVN_PASSWORD."
            exit 1
          fi

      - name: Deploy to wp.org
        uses: 10up/action-wordpress-plugin-deploy@54bd289b8525fd23a5c365ec369185f2966529c2 # 2.3.0
        with:
          generate-zip: false
          dry-run: false
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: ${{ inputs.plugin-slug }}
          VERSION: ${{ env.VERSION }}
          BUILD_DIR: ./built/${{ inputs.plugin-slug }}
          # Banner/icon assets from source's .wordpress-org/ — 10up's deploy.sh skips silently if the directory is missing.
          ASSETS_DIR: ${{ inputs.project-path }}/.wordpress-org

      - name: Attach artifact to GitHub release
        uses: softprops/action-gh-release@718ea10b132b3b2eba29c1007bb80653f286566b # zizmor: ignore[superfluous-actions] deliberate: handles release creation + asset upload as one reviewed step
        with:
          files: ./dist/${{ inputs.plugin-slug }}.zip
