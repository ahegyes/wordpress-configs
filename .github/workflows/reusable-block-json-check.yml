name: block.json Schema Check

on:
  workflow_call:
    inputs:
      plugin-path:
        description: 'Path to the plugin (relative to repo root)'
        type: string
        required: false
        default: '.'
      node-version:
        description: 'Node.js version'
        type: string
        required: false
        default: 'lts/*'

permissions:
  contents: read

jobs:
  validate:
    name: Validate block.json files
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e
        with:
          node-version: ${{ inputs.node-version }}

      - name: Find block.json files
        id: find-blocks
        working-directory: ${{ inputs.plugin-path }}
        run: |
          files=$(find . -path ./node_modules -prune -o -path ./vendor -prune -o -name 'block.json' -print | tr '\n' ' ')
          if [ -z "$files" ]; then
            echo "No block.json files found — nothing to validate."
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            echo "found=true" >> "$GITHUB_OUTPUT"
            echo "files=$files" >> "$GITHUB_OUTPUT"
          fi

      - name: Validate against WordPress block.json schema
        if: steps.find-blocks.outputs.found == 'true'
        working-directory: ${{ inputs.plugin-path }}
        run: |
          npx --yes ajv-cli validate \
            -s https://schemas.wp.org/trunk/block.json \
            -d '${{ steps.find-blocks.outputs.files }}' \
            --strict=false
