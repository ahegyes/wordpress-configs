name: block.json Schema Check

on:
  workflow_call:
    inputs:
      project-path:
        description: 'Path to the project (relative to repo root)'
        type: string
        required: false
        default: '.'

permissions: {}

jobs:
  validate:
    name: Validate block.json files
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The validator installs from this workflow's own commit of configs, whose lock Dependabot keeps current.
      - name: Check out the block.json tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .block-json-tools
          sparse-checkout: node/block-json
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'

      - name: Install ajv-cli
        working-directory: .block-json-tools/node/block-json
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Validate block.json files against the WordPress schema
        working-directory: ${{ inputs.project-path }}
        env:
          AJV: ${{ github.workspace }}/.block-json-tools/node/block-json/node_modules/.bin/ajv
        run: |
          # Validate one file per -d invocation; a single joined string breaks multi-block plugins.
          mapfile -d '' files < <(find . -path ./node_modules -prune -o -path ./vendor -prune -o -path ./.block-json-tools -prune -o -name 'block.json' -print0)
          if [ "${#files[@]}" -eq 0 ]; then
            echo "No block.json files found — nothing to validate."
            exit 0
          fi
          # schemas.wp.org publishes no versioned block.json path; trunk is the only (mutable) schema source.
          # ajv-cli reads -s from disk and picks its parser from the extension, so fetch to a .json path; curl -f fails this check on a schemas.wp.org outage.
          schema="$(mktemp -d)/schema.json"
          curl -fsSL https://schemas.wp.org/trunk/block.json -o "$schema"
          for file in "${files[@]}"; do
            echo "Validating $file"
            "$AJV" validate \
              -s "$schema" \
              -d "$file" \
              --strict=false
          done
