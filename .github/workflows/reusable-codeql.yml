name: CodeQL

on:
  workflow_call:
    inputs:
      languages:
        # CodeQL ships no PHP analyzer; PHP is statically analysed by PHPStan in the Quality workflow.
        description: 'Non-empty JSON array of CodeQL languages'
        type: string
        required: false
        default: '["actions"]'

permissions: {}

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      # An empty JSON array expands to zero matrix jobs and reports success — a silent skip of the security scan.
      - name: Reject an empty languages array
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: |
          if ! jq -e 'type == "array" and length > 0' <<< "$LANGUAGES" > /dev/null; then
            echo "::error::languages must be a non-empty JSON array — got '$LANGUAGES'."
            exit 1
          fi

  detect-ghas:
    name: Detect GHAS availability
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      security-events: read
    outputs:
      ghas-available: ${{ steps.detect.outputs.ghas-available }}
    steps:
      - name: Detect GitHub Advanced Security availability
        id: detect
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          # The code-scanning alerts endpoint answers 403 naming Advanced Security exactly where analyze would fail, and an unclear answer is retried and then read as available, because a skipped analyze passes as a green check.
          probe_body="${RUNNER_TEMP}/ghas-probe.json"
          max_attempts=3
          retry_sleep_seconds=5
          attempt=1
          while :; do
            http_code=$(curl -s --max-time 15 -o "$probe_body" -w '%{http_code}' \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${REPO}/code-scanning/alerts?per_page=1") || http_code="curl-error"

            if [ "$http_code" = "200" ]; then
              echo "ghas-available=true" >> "$GITHUB_OUTPUT"
              break
            fi

            if [ "$http_code" = "403" ] && grep -q 'Advanced Security must be enabled' "$probe_body" 2>/dev/null; then
              echo "::notice::GitHub Advanced Security is unavailable on this repository — CodeQL analyze is skipped."
              echo "ghas-available=false" >> "$GITHUB_OUTPUT"
              break
            fi

            if [ "$attempt" -lt "$max_attempts" ]; then
              attempt=$((attempt + 1))
              sleep "$retry_sleep_seconds"
              continue
            fi

            echo "::warning::GHAS availability probe was ambiguous after $max_attempts attempts (last status '$http_code') — assuming GHAS is available so analyze runs and a genuine absence fails visibly."
            echo "ghas-available=true" >> "$GITHUB_OUTPUT"
            break
          done

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: [validate-inputs, detect-ghas]
    if: needs.detect-ghas.outputs.ghas-available == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          category: '/language:${{ matrix.language }}'
