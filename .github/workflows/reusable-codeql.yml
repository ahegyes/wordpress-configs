name: CodeQL

on:
  workflow_call:
    inputs:
      languages:
        # CodeQL ships no PHP analyzer; PHP is statically analysed by PHPStan in the Quality workflow.
        description: 'Non-empty JSON array of CodeQL languages'
        type: string
        required: false
        default: '["actions"]'

permissions: {}

jobs:
  validate-inputs:
    name: Validate inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions: {}
    steps:
      # An empty JSON array expands to zero matrix jobs and reports success — a silent skip of the security scan.
      - name: Reject an empty languages array
        env:
          LANGUAGES: ${{ inputs.languages }}
        run: |
          if ! jq -e 'type == "array" and length > 0' <<< "$LANGUAGES" > /dev/null; then
            echo "::error::languages must be a non-empty JSON array — got '$LANGUAGES'."
            exit 1
          fi

  analyze:
    name: Analyze (${{ matrix.language }})
    needs: validate-inputs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      actions: read
      contents: read
      security-events: write
    strategy:
      fail-fast: false
      matrix:
        language: ${{ fromJSON(inputs.languages) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          languages: ${{ matrix.language }}

      - uses: github/codeql-action/analyze@ff2f1c621b7f889edc0d3c761ac2e6a3f8cdb0dd # v4.37.7
        with:
          category: '/language:${{ matrix.language }}'
