version: 2
updates:
  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      php-deps:
        patterns:
          - '*'

  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      npm-deps:
        patterns:
          - '*'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
      timezone: UTC
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    # This source repo keeps action bumps grouped. Consumer repos split policy at review time:
    # unprivileged build-side reusable bumps can automerge; credentialed deploy bumps need review.
    groups:
      github-actions:
        patterns:
          - '*'
